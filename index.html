<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeopleFlow | HR, Payroll & Performance Suite</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2761">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PeopleFlow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='22' fill='%23C99A3B'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-weight='900' font-size='46' text-anchor='middle' fill='%2312173F'%3EPF%3C/text%3E%3C/svg%3E">
<link rel="icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    /* "official" color theme (default) — the brand's navy + gold identity */
    --navy:#1E2761; --navy-dark:#12173F; --navy-light:#2E3A8C;
    --gold:#C99A3B; --gold-light:#E8C878;
    --ice:#DDE3F9; --bg:#F4F6FB; --card:#FFFFFF; --border:#E2E6EF;
    --text:#1F2430; --gray:#6B7280;
    --heading:#1E2761; /* headings/badge text — separate from --navy so dark mode can lighten it without touching brand backgrounds */
    --accent-soft:rgba(201,154,59,0.16); --accent-soft2:rgba(30,39,97,0.14); --glow:rgba(201,154,59,0.55);
    --green:#2E7D5B; --green-bg:#E7F4EE;
    --orange:#C97A4A; --orange-bg:#FBEEE6;
    --red:#B33A3A; --red-bg:#FBEAEA;
    --amber:#C99A3B; --amber-bg:#FBF3E1;
    --radius:10px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(30,39,97,0.08), 0 1px 2px rgba(30,39,97,0.06);
    --shadow-md:0 4px 14px rgba(18,23,63,0.10), 0 2px 6px rgba(18,23,63,0.06);
    --shadow-lg:0 12px 32px rgba(18,23,63,0.16), 0 4px 10px rgba(18,23,63,0.08);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  /* ---- Color themes: swap the two brand hues + accent glow, everything else (badges, buttons, topbar) follows automatically since they're all built from these variables ---- */
  :root[data-color-theme="vibrant"]{
    --navy:#3B1E6B; --navy-dark:#230F49; --navy-light:#5B2FA0;
    --gold:#E8408F; --gold-light:#F472B6;
    --ice:#EFE3FB; --accent-soft:rgba(232,64,143,0.18); --accent-soft2:rgba(59,30,107,0.16); --glow:rgba(232,64,143,0.6);
  }
  :root[data-color-theme="ocean"]{
    --navy:#0E4C63; --navy-dark:#0A3547; --navy-light:#136E8C;
    --gold:#2FBFA0; --gold-light:#5FE0C4;
    --ice:#DCF3F0; --accent-soft:rgba(47,191,160,0.18); --accent-soft2:rgba(14,76,99,0.16); --glow:rgba(47,191,160,0.6);
  }
  :root[data-color-theme="sunset"]{
    --navy:#3A2647; --navy-dark:#241730; --navy-light:#5A3D6B;
    --gold:#FF7A45; --gold-light:#FFB199;
    --ice:#FDE9E0; --accent-soft:rgba(255,122,69,0.2); --accent-soft2:rgba(58,38,71,0.16); --glow:rgba(255,122,69,0.6);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
      --heading:#C9D0FF;
      --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
      --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
    }
  }
  :root[data-theme="dark"] {
    --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
    --heading:#C9D0FF;
    --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
    --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
  }
  :root[data-theme="dark"][data-color-theme="vibrant"], :root:not([data-theme="light"])[data-color-theme="vibrant"]{ --heading:#F4C9E8; }
  :root[data-theme="dark"][data-color-theme="ocean"], :root:not([data-theme="light"])[data-color-theme="ocean"]{ --heading:#B9F3E8; }
  :root[data-theme="dark"][data-color-theme="sunset"], :root:not([data-theme="light"])[data-color-theme="sunset"]{ --heading:#FFD9C2; }
  /* Decorative infographic-style background: soft color blobs + a faint dot grid.
     Colors derive from the active theme's accent so it changes with both the
     color theme and light/dark mode. Fixed + behind everything + non-interactive. */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(circle at 10% 10%, var(--accent-soft) 0%, transparent 42%),
      radial-gradient(circle at 90% 18%, var(--accent-soft2) 0%, transparent 40%),
      radial-gradient(circle at 25% 92%, var(--accent-soft) 0%, transparent 46%),
      radial-gradient(circle at 82% 88%, var(--accent-soft2) 0%, transparent 42%);
    transition:background .3s var(--ease);
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.55;
    background-image:radial-gradient(var(--border) 1px, transparent 1px);
    background-size:24px 24px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Cairo', Arial, Tahoma, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);}
  [dir="ltr"] body{font-family:'Cairo', Arial, sans-serif;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold-light); color:var(--navy-dark);}

  /* Accessible focus ring, everywhere, keyboard-only */
  *:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:50; box-shadow:var(--shadow-md);
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(155deg, var(--gold-light), var(--gold));
    display:flex; align-items:center; justify-content:center; color:var(--navy-dark); font-weight:800; font-size:18px;
    flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.1px;}
  .brand-text p{font-size:11.5px; margin:0; opacity:0.75;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .pill-btn{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff;
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;
    transition:background .18s var(--ease), transform .12s var(--ease);
  }
  .pill-btn:hover{background:rgba(255,255,255,0.22); transform:translateY(-1px);}
  .pill-btn:active{transform:translateY(0);}
  /* Icon-only topbar buttons (theme/lang toggles) — solid white squares, matching the Figma redesign's topbar */
  .icon-pill{
    background:#fff; border:none; color:var(--heading); padding:8px 12px; border-radius:8px;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; box-shadow:0 1px 2px rgba(0,0,0,0.06);
    transition:transform .12s var(--ease), box-shadow .16s var(--ease);
  }
  .icon-pill:hover{transform:translateY(-1px) scale(1.08); box-shadow:0 3px 8px rgba(0,0,0,0.14), 0 0 10px var(--glow);}
  .icon-pill:active{transform:translateY(0) scale(1);}

  /* Color-theme picker: small glowing swatch buttons in the topbar */
  .theme-picker{display:flex; align-items:center; gap:6px; padding:2px 4px;}
  .theme-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,0.55); cursor:pointer; padding:0;
    background:var(--dot-navy, #1E2761); box-shadow:0 0 0 rgba(0,0,0,0);
    transition:transform .16s var(--ease), box-shadow .2s var(--ease), border-color .16s var(--ease);
  }
  .theme-dot::after{ content:none; }
  .theme-dot[data-swatch="official"]{background:linear-gradient(135deg,#1E2761,#C99A3B);}
  .theme-dot[data-swatch="vibrant"]{background:linear-gradient(135deg,#3B1E6B,#E8408F);}
  .theme-dot[data-swatch="ocean"]{background:linear-gradient(135deg,#0E4C63,#2FBFA0);}
  .theme-dot[data-swatch="sunset"]{background:linear-gradient(135deg,#3A2647,#FF7A45);}
  .theme-dot:hover{transform:scale(1.22);}
  .theme-dot.active{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25), 0 0 10px rgba(255,255,255,0.5);}

  .stepper{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--border);
    overflow-x:auto; position:sticky; top:66px; z-index:40; scrollbar-width:thin;
  }
  .step-item{
    flex:1; min-width:128px; padding:11px 12px; text-align:center; position:relative;
    font-size:12px; font-weight:700; color:var(--gray); display:flex; flex-direction:column; align-items:center; gap:4px;
    white-space:nowrap; transition:color .18s var(--ease), background .18s var(--ease);
  }
  .step-item::after{
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:0; height:3px;
    background:var(--gold); border-radius:3px 3px 0 0; transition:width .22s var(--ease);
  }
  .step-item .num{
    width:24px; height:24px; border-radius:50%; background:var(--border); color:var(--gray);
    display:flex; align-items:center; justify-content:center; font-size:13px; transition:background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .step-item .num svg{ width:14px; height:14px; display:block; transition:filter .18s var(--ease); }
  .step-item.active .num svg, .step-item.clickable:hover .num svg{ filter:drop-shadow(0 0 3px currentColor); }
  .step-item.active{color:var(--heading); background:linear-gradient(180deg, var(--accent-soft), transparent);}
  .step-item.active::after{width:56%; background:var(--gold);}
  .step-item.active .num{background:var(--navy); color:#fff; transform:scale(1.06); box-shadow:0 0 0 4px var(--accent-soft), 0 0 14px var(--glow);}
  .step-item.done .num{background:var(--green); color:#fff;}
  .step-item.clickable{cursor:pointer;}
  .step-item.clickable:hover{color:var(--heading); background:var(--accent-soft);}
  .step-item.clickable:hover .num{transform:scale(1.15); box-shadow:0 0 12px var(--glow);}

  main{max-width:1180px; margin:0 auto; padding:22px 18px 60px;}
  @keyframes stepFadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  main.step-anim{animation:stepFadeIn .3s var(--ease);}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:21px; margin:0 0 4px; color:var(--heading); font-weight:800; letter-spacing:-.2px;}
  .section-head p{font-size:13px; color:var(--gray); margin:0;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; transition:box-shadow .2s var(--ease);}
  .card h3{margin:0 0 12px; font-size:15px; color:var(--heading); font-weight:800;}
  .card-flat{background:var(--ice); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px;}

  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{
    padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:13px; font-weight:700; transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease), transform .12s var(--ease);
  }
  .tab-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--heading);}

  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--gray); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease); min-height:38px;
  }
  .field input:hover, .field select:hover{border-color:var(--gold-light);}
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}

  .btn{
    padding:10px 18px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s var(--ease), box-shadow .18s var(--ease), background .16s var(--ease), opacity .16s var(--ease);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(30,39,97,0.25);}
  .btn-primary:hover{background:var(--navy-light); box-shadow:0 4px 14px rgba(30,39,97,0.32);}
  .btn-gold{background:linear-gradient(155deg, var(--gold-light), var(--gold)); color:var(--navy-dark); box-shadow:0 2px 8px rgba(201,154,59,0.3);}
  .btn-gold:hover{box-shadow:0 4px 14px rgba(201,154,59,0.4);}
  .btn-outline{background:transparent; border:1.5px solid var(--navy); color:var(--heading);}
  .btn-outline:hover{background:rgba(30,39,97,0.06);}
  .btn-ghost{background:var(--border); color:var(--text);}
  .btn-danger{background:var(--red-bg); color:var(--red); border:1px solid var(--red);}
  .btn-export-excel{background:transparent; border:1.5px solid var(--green); color:var(--green);}
  .btn-export-excel:hover{background:var(--green-bg);}
  .btn-export-pdf{background:transparent; border:1.5px solid var(--red); color:var(--red);}
  .btn-export-pdf:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 10px; text-align:start; border-bottom:1px solid var(--border);}
  th{background:var(--ice); color:var(--heading); font-size:11px; font-weight:800; white-space:nowrap; letter-spacing:.1px; position:sticky; top:0;}
  tbody tr{transition:background .12s var(--ease);}
  tr:hover td{background:rgba(221,227,249,0.35);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; max-height:520px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800;}
  .badge-green{background:var(--green-bg); color:var(--green);}
  .badge-amber{background:var(--amber-bg); color:var(--amber);}
  .badge-orange{background:var(--orange-bg); color:var(--orange);}
  .badge-red{background:var(--red-bg); color:var(--red);}
  .badge-navy{background:var(--ice); color:var(--heading);}

  .method-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:900px){.method-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.method-grid{grid-template-columns:repeat(2,1fr);}}
  .method-card{
    border:2px solid var(--border); border-radius:var(--radius); padding:14px 10px; text-align:center; background:var(--card);
    transition:border-color .18s var(--ease), transform .16s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  }
  .method-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md), 0 0 16px var(--glow); border-color:var(--gold-light);}
  .method-card .mi{font-size:22px; margin-bottom:6px; transition:transform .18s var(--ease), filter .18s var(--ease);}
  .method-card:hover .mi{transform:scale(1.18); filter:drop-shadow(0 0 6px var(--glow));}
  .method-card .mt{font-weight:800; font-size:13px; color:var(--heading);}
  .method-card .md{font-size:10.5px; color:var(--gray); margin-top:3px;}
  .method-card.selected{border-color:var(--heading); background:var(--navy); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-md), 0 0 18px var(--glow); transform:translateY(-2px);}
  .method-card.selected .mt{color:#fff;}
  .method-card.selected .md{color:rgba(255,255,255,0.75);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--gray); border:1.5px dashed var(--border); border-radius:var(--radius); background:rgba(202,220,252,0.06);}
  .empty-state .ei{font-size:32px; margin-bottom:10px; opacity:.85;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; justify-content:space-between;}
  .toolbar .left{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  .kv-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;}
  .kv-row span:first-child{color:var(--gray);}
  .kv-row span:last-child{font-weight:700;}

  .score-hero{
    display:flex; align-items:center; gap:22px; background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff; border-radius:var(--radius); padding:24px; margin-bottom:16px; flex-wrap:wrap; box-shadow:var(--shadow-lg);
  }
  .score-circle{
    width:110px; height:110px; border-radius:50%; border:6px solid var(--gold); display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,0.05);
  }
  .score-circle b{font-size:26px;}
  .score-circle span{font-size:10.5px; opacity:0.8;}
  .score-info h3{margin:0 0 4px; font-size:17px;}
  .score-info p{margin:0; font-size:12.5px; opacity:0.85;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(6px); background:var(--navy); color:#fff;
    padding:11px 20px; border-radius:10px; font-size:13px; font-weight:700; z-index:200; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease), transform .22s var(--ease);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,45,0.55); z-index:150; display:flex; align-items:center; justify-content:center; padding:16px;
    animation:overlayIn .18s var(--ease);
  }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }

/* IDs must be real UUIDs now: employees/job_families/job_levels/cost_centers
   all have a Postgres `uuid` primary key, and every id created client-side
   (new employee, new cost center, ...) gets upserted straight into it. */
function uid(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

/* Loads every table into `state` after a successful sign-in. */
async function loadAllData(){
  // Resolve this account's own company_id first — every other table read
  // below is RLS-scoped to it, but the client still needs to know it to
  // tag new rows it writes (see empToRow/deptToRow/... and state.session.companyId).
  const myProfile = await sb.from('profiles').select('company_id, is_platform_owner').eq('id', state.session.userId).maybeSingle();
  state.session.companyId = myProfile.data ? myProfile.data.company_id : null;
  state.session.isPlatformOwner = !!(myProfile.data && myProfile.data.is_platform_owner);

  const [profiles, employees, depts, families, levels, ccs, evals, settings, company, positions, positionHistory, eosbLedger, payrollCycleSettings, payrollJurisdictions, payrollTaxBrackets, payrollComponents] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('employees').select('*'),
    sb.from('departments').select('*'),
    sb.from('job_families').select('*'),
    sb.from('job_levels').select('*').order('rank'),
    sb.from('cost_centers').select('*'),
    sb.from('evaluations').select('*'),
    sb.from('app_settings').select('*').eq('company_id', state.session.companyId).maybeSingle(),
    sb.from('companies').select('*').eq('id', state.session.companyId).maybeSingle(),
    sb.from('positions').select('*'),
    sb.from('position_history').select('*'),
    sb.from('payroll_eosb_ledger').select('*'),
    sb.from('company_payroll_settings').select('*').eq('company_id', state.session.companyId).maybeSingle(),
    // Global reference data (same rows for every tenant in a given country —
    // see payroll_calc_engine_rates migration): readable by everyone, but only
    // ever writable by the platform owner via the platform_* RPCs, since one
    // company's admin must never be able to change another company's payroll math.
    sb.from('payroll_jurisdictions').select('*'),
    sb.from('payroll_tax_brackets').select('*').order('bracket_order'),
    sb.from('employee_payroll_components').select('*'),
  ]);
  state.companyPayrollSettings = { payrollPeriodStartDay: (payrollCycleSettings.data && payrollCycleSettings.data.payroll_period_start_day) || 1 };
  state.payrollJurisdictions = {};
  (payrollJurisdictions.data||[]).forEach(r=>{ state.payrollJurisdictions[r.code] = r; });
  state.payrollTaxBrackets = payrollTaxBrackets.data||[];
  state.payrollComponents = (payrollComponents.data||[]).map(payrollComponentFromRow);

  state.positions = (positions.data||[]).map(positionFromRow);
  state.positionHistory = (positionHistory.data||[]).map(positionHistoryFromRow);
  state.eosbLedger = (eosbLedger.data||[]).map(eosbLedgerFromRow);
  if(company.data){
    state.company = { id:company.data.id, name:company.data.name, plan:company.data.plan,
      employeeLimit:company.data.employee_limit, allowedEvalMethods:company.data.allowed_eval_methods||['kpi'],
      inviteCode:company.data.invite_code, payrollJurisdiction:company.data.payroll_jurisdiction||'EG',
      enabledModules:company.data.enabled_modules||{} };
  }
  state.users = (profiles.data||[]).map(userFromRow);
  state.employees = (employees.data||[]).map(empFromRow);
  state.departments = {};
  (depts.data||[]).forEach(r=>{ state.departments[r.name] = deptFromRow(r); });
  state.jobFamilies = (families.data||[]).map(familyFromRow);
  state.jobLevels = (levels.data||[]).map(levelFromRow);
  state.costCenters = (ccs.data||[]).map(ccFromRow);
  state.evaluations = {};
  (evals.data||[]).forEach(r=>{ state.evaluations[r.employee_id] = { method:r.method, data:r.data||{}, score:r.score, date:r.eval_date, evaluatedBy:r.evaluated_by||'' }; });
  if(settings.data){ state.gradeMap = settings.data.grade_map||{}; state.familyMap = settings.data.family_map||{}; state.templates = settings.data.templates||{kpi:[],mbo:[],bars:[],'360':[]}; }
  ensureJobLevelPerms();
  // A brand-new, never-seeded database: seed the default job families/levels
  // once, and push them straight to Supabase so every future sign-in sees them.
  if(state.jobFamilies.length===0 && state.jobLevels.length===0){
    seedJobArchitectureDefaults();
    await Promise.all([
      sb.from('job_families').upsert(state.jobFamilies.map(f=>({id:f.id,company_id:state.session.companyId,name:f.name,archived:f.archived}))),
      sb.from('job_levels').upsert(state.jobLevels.map(l=>({id:l.id,company_id:state.session.companyId,name:l.name,rank:l.rank,active:l.active,perms:l.perms}))),
    ]);
  }
  // A resigned employee stays fully active/paid through the payroll cycle
  // that covers their resignation date — this only ever moves them to Former
  // Employees once today is actually past that cycle's end date.
  await reconcileResignedEmployees();
}
/* ---- Payroll cycle (period start day) + resignation → Former transition ---- */
/* All-UTC date math on purpose: this drives a real business date (when a
   resigned employee actually leaves the active headcount), so it must give
   the exact same answer no matter which timezone the browser or server
   happens to be running in — mixing local-time Date construction with
   toISOString() (UTC) would silently shift cycle boundaries by a day
   depending on the machine's local timezone offset. */
function payrollCycleContaining(dateStr){
  const startDay = (state.companyPayrollSettings && state.companyPayrollSettings.payrollPeriodStartDay) || 1;
  const d = new Date(dateStr+'T00:00:00Z');
  if(isNaN(d)) return null;
  const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
  // The cycle whose START falls in the same month as `d` if day >= startDay,
  // otherwise the cycle that started the previous month (e.g. startDay=25: Sep 24
  // belongs to the cycle that started Aug 25).
  let cycleStart = new Date(Date.UTC(y, m, Math.min(startDay, daysInMonth(y, m+1))));
  if(day < startDay) cycleStart = new Date(Date.UTC(y, m-1, Math.min(startDay, daysInMonth(y, m))));
  const csY = cycleStart.getUTCFullYear(), csM = cycleStart.getUTCMonth();
  const cycleEnd = new Date(Date.UTC(csY, csM+1, Math.min(startDay, daysInMonth(csY, csM+2)) - 1));
  return { start: toISODate(cycleStart), end: toISODate(cycleEnd) };
}
function daysInMonth(year, month1to12){ return new Date(Date.UTC(year, month1to12, 0)).getUTCDate(); }
function toISODate(d){ return d.toISOString().slice(0,10); }
async function reconcileResignedEmployees(){
  const todayISO = toISODate(new Date());
  const due = (state.employees||[]).filter(e=>e.employmentStatus!=='former' && e.resignationDate);
  for(const emp of due){
    const cycle = payrollCycleContaining(emp.resignationDate);
    if(!cycle || todayISO <= cycle.end) continue; // still inside the cycle that covers the resignation — keep paying/showing as active
    try{
      const { error } = await sb.rpc('terminate_employee', {
        p_employee_id: emp.id, p_termination_date: emp.resignationDate,
        p_termination_type: 'resignation', p_termination_reason: null,
      });
      if(error) continue;
      await sb.from('employees').update({ moved_to_former_at: todayISO }).eq('id', emp.id);
      emp.employmentStatus = 'former'; emp.terminationDate = emp.resignationDate; emp.terminationType = 'resignation';
      emp.movedToFormerAt = todayISO;
    }catch(e){ /* best-effort — try again next load */ }
  }
}

/* Pushes the CURRENT in-memory arrays/objects back to Supabase. This mirrors
   the old saveState()'s "persist everything after every render" behavior,
   but as upserts against the shared database instead of one localStorage
   blob. Row deletions are handled separately, right where an item is removed
   from state (see deleteEmployee/deleteUser/deleteFamily/... ), since an
   upsert alone can never remove a row. Best-effort and fire-and-forget, same
   as the old saveState — a transient network hiccup must never block the UI. */
let __syncTimer = null;
function syncStateToSupabase(){
  if(!isLoggedIn()) return;
  clearTimeout(__syncTimer);
  __syncTimer = setTimeout(doSyncStateToSupabase, 150);
}
async function doSyncStateToSupabase(){
  try{
    const jobs = [];
    if(state.employees.length) jobs.push(sb.from('employees').upsert(state.employees.map(empToRow)));
    // profiles are intentionally NOT synced here: every profile change goes
    // through admin_update_user / update_own_name / bootstrap_own_profile,
    // since those are the only paths the database's RLS policies allow.
    const deptRows = Object.keys(state.departments).map(name=>deptToRow(name, state.departments[name]));
    if(deptRows.length) jobs.push(sb.from('departments').upsert(deptRows));
    if((state.jobFamilies||[]).length) jobs.push(sb.from('job_families').upsert(state.jobFamilies.map(f=>({id:f.id,company_id:state.session.companyId,name:f.name,archived:f.archived}))));
    if((state.jobLevels||[]).length) jobs.push(sb.from('job_levels').upsert(state.jobLevels.map(l=>({id:l.id,company_id:state.session.companyId,name:l.name,rank:l.rank,active:l.active,perms:l.perms}))));
    if((state.costCenters||[]).length) jobs.push(sb.from('cost_centers').upsert(state.costCenters.map(ccToRow)));
    const evalRows = Object.keys(state.evaluations).map(empId=>evalToRow(empId, state.evaluations[empId]));
    if(evalRows.length) jobs.push(sb.from('evaluations').upsert(evalRows));
    jobs.push(sb.from('app_settings').upsert({company_id:state.session.companyId, grade_map:state.gradeMap||{}, family_map:state.familyMap||{}, templates:state.templates||{kpi:[],mbo:[],bars:[],'360':[]}}));
    await Promise.all(jobs);
  }catch(e){ /* best-effort, same spirit as the old saveState()'s silent catch */ }
}
/* Kept as the persistence entry point everywhere else in this file already
   calls it (every render() call used to end with saveState()) — now it syncs
   to Supabase instead of localStorage, only once actually signed in. */
function saveState(){ syncStateToSupabase(); }

/* ============================== Permissions (client-side scoping only — NOT secure auth) ============================== */
function currentUser(){
  if(!state.session.userId) return null;
  return state.users.find(u=>u.id===state.session.userId) || null;
}
function isLoggedIn(){ return !!state.session.userId; }
function isAdmin(){ const u=currentUser(); return !u || u.role==='admin'; }
function userScopeAllowsEmployee(user, emp){
  if(!user || user.role==='admin') return true;
  if(!emp) return false;
  if(user.role==='manager' || user.role==='sectionhead') return (emp.department||'')===(user.department||'');
  if(user.role==='supervisor') return (emp.department||'')===(user.department||'') && (emp.managerName||'')===(user.name||'');
  /* Department followers: a user listed as a "follower"/monitor of a department
     (state.departments[dept].followers, an array of user ids — several people
     can follow the same department) gets read/oversight visibility into that
     department's employees, on top of whatever their role already grants. */
  if(isDeptFollower(user.id, emp.department)) return true;
  return false;
}
function isDeptFollower(userId, deptName){
  if(!userId || !deptName) return false;
  const rec = state.departments[deptName];
  return !!(rec && Array.isArray(rec.followers) && rec.followers.includes(userId));
}
/* Grade-based permissions are an ADDITIONAL layer on top of the per-user
   checkboxes, not a replacement: a user gets an action if their own perms
   grant it OR their assigned Job Grade's default permissions grant it.
   The grade's permission set lives on the job level record itself
   (state.jobLevels[i].perms) — the single source of truth, same place the
   grade's name/rank already live — never duplicated onto each user. */
function gradePermGrant(user, action){
  if(!user || !user.grade) return false;
  const lvl = (state.jobLevels||[]).find(l=>l.name===user.grade);
  return !!(lvl && lvl.perms && lvl.perms[action]);
}
function hasPerm(action, emp){
  const u = currentUser();
  if(!u) return true;
  if(u.role==='admin') return true;
  if(emp && !userScopeAllowsEmployee(u, emp)) return false;
  return !!((u.perms && u.perms[action]) || gradePermGrant(u, action));
}
function visibleEmployees(){
  const u = currentUser();
  if(!u || u.role==='admin') return state.employees;
  return state.employees.filter(e=>userScopeAllowsEmployee(u,e));
}
function roleLabel(r){
  const map = {
    admin:{ar:'مدير النظام (كل الصلاحيات)',en:'Admin (full access)'},
    manager:{ar:'مدير القسم',en:'Department Manager'},

    supervisor:{ar:'مشرف',en:'Supervisor'},
  };
  return map[r] ? map[r][state.lang] : r;
}

/* Custom confirm modal — native confirm()/alert() are unreliable inside a sandboxed
   artifact iframe (can silently no-op), so every yes/no confirmation in this app
   goes through this instead of window.confirm(). Renders directly to document.body
   so it survives independently of the main render() cycle. */
function appConfirm(message, onYes){
  const old = document.getElementById('appConfirmOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'appConfirmOverlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>⚠️ ${esc(state.lang==='ar'?'تأكيد الإجراء':'Confirm action')}</h3>
      <p style="font-size:13.5px; line-height:1.8;">${esc(message)}</p>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-ghost" data-role="no">${esc(t('close'))}</button>
        <button class="btn btn-danger" data-role="yes">${esc(state.lang==='ar'?'تأكيد':'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=>{ overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(); });
  overlay.querySelector('[data-role="no"]').onclick = cleanup;
  overlay.querySelector('[data-role="yes"]').onclick = ()=>{ cleanup(); onYes(); };
}
function gradeLabel(v){ if(!v) return ''; const lv = (state.jobLevels||[]).find(x=>x.name===v); return lv ? lv.name : v; }
function familyLabel(v){ if(!v) return ''; const f = (state.jobFamilies||[]).find(x=>x.id===v || x.name===v); return f ? f.name : v; }
function seedJobArchitectureDefaults(){
  let changed = false;
  if(state.jobFamilies === null){
    state.jobFamilies = ['Operations','Support','Services'].map(name=>({id:uid(), name, archived:false}));
    changed = true;
  }

    state.jobLevels = defaults.map(([name,rank])=>({id:uid(), name, rank, active:true, perms:{add:false,remove:false,evaluate:false,print:false}}));
    changed = true;

}
/* Defensive fallback: job levels saved before the Grade-permissions feature
   existed won't have a `perms` field yet — this backfills it in place
   (once, on load) so every level always has one to read/write safely. */
function ensureJobLevelPerms(){
  let changed = false;
  (state.jobLevels||[]).forEach(l=>{
    if(!l.perms){ l.perms = {add:false,remove:false,evaluate:false,print:false}; changed = true; }
  });
  return changed;
}

function computeBand(score){

  if(score>=70) return {key:'good', label:t('band_good'), cls:'badge-amber'};

function fmtNum(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function fmtDate(d){
  if(!d) return '';
  const s = String(d).trim();
  // Guard: a bare number here is not a real date (e.g. an un-converted Excel/Sheets
  // serial date that slipped through import) — showing it would misread as a year
  // like "01/01/44444". Blank it out instead of rendering garbage.
  if(/^\d+$/.test(s)) return '';
  try{
    const dt = new Date(s);
    if(isNaN(dt.getTime())) return '';
    return dt.toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB');
  }catch(e){ return ''; }
}
// Normalizes a raw Excel/Sheets cell value into an ISO 'YYYY-MM-DD' date string.
// Handles three shapes a hire-date cell can arrive in: a real JS Date (when the
// workbook is read with cellDates:true), an Excel/Sheets serial-date number (the
// classic bug when a date-formatted cell round-trips through export/paste and
// loses its cell type), or an already-readable date string.
function excelValueToISODate(v){
  if(v===null || v===undefined || v==='') return '';
  const pad = n => String(n).padStart(2,'0');
  if(v instanceof Date && !isNaN(v.getTime())){
    return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  }
  const s = String(v).trim();
  if(/^\d{4,6}$/.test(s)){
    // Excel/Sheets serial date: day count since 1899-12-30 (accounts for the
    // spreadsheet 1900 leap-year bug). Convert to a real date.
    const serial = Number(s);
    const dt = new Date(Math.round((serial - 25569) * 86400 * 1000));
    if(!isNaN(dt.getTime())) return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
    return '';
  }
  const dt = new Date(s);
  if(!isNaN(dt.getTime())) return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;
  return s; // leave whatever text was there; fmtDate() will blank it out if it's not a real date
}
function employeeById(id){ return state.employees.find(e=>e.id===id); }

function employeeLimitReached(extra){ extra = extra||0; if(!state.company) return false; return (state.employees.length+extra) > (state.company.employeeLimit||Infinity); }
function evalMethodAllowed(method){ if(!state.company) return true; return (state.company.allowedEvalMethods||['kpi']).includes(method); }
function methodLabel(m){ return {kpi:t('m_kpi'), mbo:t('m_mbo'), '360':t('m_360'), bars:t('m_bars'), ranking:t('m_rank')}[m]||m; }

/* Payroll & Personnel modules are sold/enabled independently per company (each
   tenant only pays for the parts they need). refPrice is a market-researched
   reference figure for the platform owner's own use when quoting a customer —
   it is never shown to tenants; tenants only ever see a "contact us" CTA,
   matching the existing trial→full upgrade flow above. */
const MODULE_CATALOG = [
  { key:'positions', nameKey:'moduleNamePositions', pricing:'perEmployeeTiered' },
  { key:'former',    nameKey:'moduleNameFormer',    pricing:'perEmployeeTiered' },
  { key:'import',    nameKey:'moduleNameImport',    pricing:'flat', flatPrice:300 },
  { key:'analytics', nameKey:'moduleNameAnalytics', pricing:'flat', flatPrice:300 },

   never shown to tenants (they only ever see a "contact us" CTA). Positions
   and Former are billed per-employee with a size tier: >100 employees pays a
   higher per-head rate (50 EGP), 100 or fewer pays a lower rate (30 EGP).
   Import and Analytics are flat monthly add-ons regardless of headcount. */
function moduleRefPriceLabel(mod, employeeCount){
  if(mod.pricing==='flat') return `${mod.flatPrice} ${state.lang==='ar'?'ج.م/شهر':'EGP/mo'}`;
  const perHead = (employeeCount||0) > 100 ? 50 : 30;
  const total = perHead * (employeeCount||0);
  return state.lang==='ar'
    ? `${perHead} ج.م/موظف (إجمالي ~${total} ج.م/شهر)`
    : `${perHead} EGP/employee (~${total} EGP/mo total)`;
}

/* ============================== Payroll & Personnel module ==============================
   Self-contained section: its own sub-tabs, its own render/mutate functions,
   but reads/writes the SAME state.employees / state.positions / state.positionHistory
   that the rest of the app uses — so ending an employee's service here is
   immediately reflected everywhere else (dashboard counts, employee list, ...),
   and vice versa. Position/employment-status changes always go through the
   assign_employee_to_position / terminate_employee RPCs (never a raw upsert)
   so the position history and employment status stay consistent server-side. */
const TERMINATION_TYPES = ['resignation','dismissal','end_of_contract','retirement','death','mutual_agreement','other'];

/* ---- End-of-service dues (EOSB / gratuity), computed client-side at the
   moment a service is ended, using the employee's open-ended/fixed-term
   contract, hire date, base salary and the COMPANY's payroll jurisdiction
   (state.company.payrollJurisdiction, defaulting to 'EG'). This is a
   trimmed port of the same rules verified for the standalone payroll
   calculation engine built earlier (SA Labor Law Art. 84, UAE Labor Law
   2021, Egypt's 3-tier structure under Labour Law 14/2025 — Egypt has NO
   Gulf-style employer gratuity, so its "payable" figure is usually 0
   unless the uncovered-service-period edge case applies). Results are
   saved to payroll_eosb_ledger as a DRAFT for HR/finance to review before
   an actual payout — never auto-marked as paid. */
const EOSB_CONFIG = {
  SA: { firstYearsThreshold:5, perYearBeforeThreshold:0.5, perYearAfterThreshold:1.0,
        resignationFactors:[{minYears:2,maxYears:5,factor:1/3},{minYears:5,maxYears:10,factor:2/3},{minYears:10,maxYears:Infinity,factor:1}] },
  AE: { firstYearsThreshold:5, daysPerYearBeforeThreshold:21, daysPerYearAfterThreshold:30, maxGratuityMonths:24, minServiceYears:1 },
  EG: { retirementAge:60, uncoveredPeriodGratuity:{firstYearsThreshold:5, perYearBeforeThreshold:0.5, perYearAfterThreshold:1.0} },
};
const JURISDICTION_CURRENCY = { EG:'EGP', SA:'SAR', AE:'AED' };
const RETIREMENT_AGE_BY_JURISDICTION = { EG:60, SA:60, AE:60 };
function computeAge(dob){
  if(!dob) return null;
  const d = new Date(dob); if(isNaN(d)) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m<0 || (m===0 && now.getDate()<d.getDate())) age--;
  return age;
}
/* Retirement status for the Personnel highlight — near (within 12 months) or
   past retirement age, based on the company's payroll jurisdiction. People
   past retirement age are NEVER removed from the database on this basis
   alone — they stay fully active/paid as long as the company keeps them on;
   this is purely a visual flag so HR notices and can plan ahead. */
function employeeRetirementStatus(emp){
  const age = computeAge(emp.dateOfBirth);
  if(age==null) return { age:null, status:'' };
  const retAge = RETIREMENT_AGE_BY_JURISDICTION[state.company && state.company.payrollJurisdiction] || 60;
  if(age >= retAge) return { age, status:'past' };
  if(age >= retAge-1) return { age, status:'near' };
  return { age, status:'' };
}
function yearsOfServiceClient(hireDate, lastWorkingDate){
  const ms = new Date(lastWorkingDate) - new Date(hireDate);
  return ms / (1000*60*60*24*365.25);
}
function calcEOSBClient(jurisdiction, monthlyBaseSalary, hireDate, lastWorkingDate, terminationType, employee){
  const yrs = yearsOfServiceClient(hireDate, lastWorkingDate);
  const currency = JURISDICTION_CURRENCY[jurisdiction] || 'EGP';
  const ar = state.lang==='ar';

  if(jurisdiction==='SA'){
    const cfg = EOSB_CONFIG.SA;
    const dailyRate = monthlyBaseSalary/30;
    const firstYears = Math.min(yrs, cfg.firstYearsThreshold);
    const extraYears = Math.max(0, yrs - cfg.firstYearsThreshold);
    const gross = firstYears*cfg.perYearBeforeThreshold*30*dailyRate + extraYears*cfg.perYearAfterThreshold*30*dailyRate;
    let factor = 1;
    if(terminationType==='resignation'){
      const bucket = cfg.resignationFactors.find(b=>yrs>=b.minYears && yrs<b.maxYears);
      factor = bucket ? bucket.factor : (yrs<2 ? 0 : 1);
    }
    const payable = gross*factor;
    return { method:'saudi_labor_law_art84', yearsOfService:round2(yrs), payableGratuity:round2(payable), currency,
      notes: ar
        ? `مكافأة نهاية الخدمة (المادة 84) — ${round2(yrs)} سنة خدمة. الإجمالي ${round2(gross)} ${currency}${factor<1?`، بعد تخفيض الاستقالة (${Math.round(factor*100)}%) = ${round2(payable)} ${currency}`:''}.`
        : `End-of-service gratuity (Art. 84) — ${round2(yrs)} years of service. Gross ${round2(gross)} ${currency}${factor<1?`, reduced for resignation (${Math.round(factor*100)}%) = ${round2(payable)} ${currency}`:''}.` };
  }

  if(jurisdiction==='AE'){
    const cfg = EOSB_CONFIG.AE;
    if(yrs < cfg.minServiceYears){
      return { method:'uae_labor_law_2021', yearsOfService:round2(yrs), payableGratuity:0, currency,
        notes: ar ? 'أقل من سنة خدمة — لا يستحق مكافأة نهاية الخدمة.' : 'Less than one year of service — no end-of-service gratuity due.' };
    }
    const dailyRate = monthlyBaseSalary/30;
    const firstYears = Math.min(yrs, cfg.firstYearsThreshold);
    const extraYears = Math.max(0, yrs - cfg.firstYearsThreshold);
    const gross = firstYears*cfg.daysPerYearBeforeThreshold*dailyRate + extraYears*cfg.daysPerYearAfterThreshold*dailyRate;
    const cap = monthlyBaseSalary*cfg.maxGratuityMonths;
    const payable = Math.min(gross, cap);
    return { method:'uae_labor_law_2021', yearsOfService:round2(yrs), payableGratuity:round2(payable), currency,
      notes: ar
        ? `مكافأة نهاية الخدمة — ${round2(yrs)} سنة خدمة = ${round2(payable)} ${currency}${gross>cap?' (بعد تطبيق الحد الأقصى 24 شهر أجر)':''}.`
        : `End-of-service gratuity — ${round2(yrs)} years of service = ${round2(payable)} ${currency}${gross>cap?" (capped at 24 months' pay)":''}.` };
  }

  // EG: no Gulf-style employer gratuity by default — end-of-service dues run
  // through the Social Insurance pension instead. The narrow legacy
  // "uncovered service period" reward is auto-applied here only for the
  // detectable case (employee at/above retirement age at termination); the
  // under-18 case needs hire-date-vs-birth-date overlap and isn't
  // auto-detected client-side, so it's left for manual review.
  const pensionNote = ar
    ? 'مكافأة نهاية الخدمة في مصر أساسًا عن طريق معاش/تعويض التأمينات الاجتماعية، وليست مبلغًا يدفعه صاحب العمل مباشرة (قانون العمل 14/2025 لا يستحدث نظام مكافأة خليجي).'
    : 'End-of-service benefits in Egypt run mainly through the Social Insurance pension, not a direct employer-paid gratuity (Labour Law 14/2025 doesn\'t introduce a Gulf-style gratuity).';
  // Only the portion of tenure actually spent PAST retirement age is
  // "uncovered" — not the whole tenure. E.g. an employee hired at 44 and
  // retiring at 66 has 16 covered years (44-60) and only 6 uncovered ones
  // (60-66); using the full 22-year tenure here would badly overstate it.
  let uncovered = null;
  const ageAtEnd = employee && employee.dateOfBirth ? yearsOfServiceClient(employee.dateOfBirth, lastWorkingDate) : null;
  if(ageAtEnd != null && ageAtEnd >= EOSB_CONFIG.EG.retirementAge){
    const retirementDate = new Date(employee.dateOfBirth);
    retirementDate.setFullYear(retirementDate.getFullYear() + EOSB_CONFIG.EG.retirementAge);
    const uncoveredStart = Math.max(new Date(hireDate).getTime(), retirementDate.getTime());
    const uncoveredYrs = Math.max(0, (new Date(lastWorkingDate).getTime() - uncoveredStart) / (1000*60*60*24*365.25));
    const g = EOSB_CONFIG.EG.uncoveredPeriodGratuity;
    const firstYears = Math.min(uncoveredYrs, g.firstYearsThreshold);
    const extraYears = Math.max(0, uncoveredYrs - g.firstYearsThreshold);
    uncovered = round2(firstYears*g.perYearBeforeThreshold*monthlyBaseSalary + extraYears*g.perYearAfterThreshold*monthlyBaseSalary);
  }
  let extraNote = '';
  if(terminationType==='dismissal'){
    extraNote = ar
      ? ' ملحوظة: لو تقرر قضائيًا أن الفصل تعسفي، يستحق تعويض إضافي (مادة 165) يُحسب يدويًا حسب حكم المحكمة.'
      : ' Note: if a labor court rules this dismissal unjustified, additional compensation (Art. 165) applies and must be calculated manually per the ruling.';
  }
  return { method:'egypt_three_tier_2025', yearsOfService:round2(yrs), payableGratuity: uncovered||0, currency,
    notes: pensionNote + (uncovered ? (ar ? ` مكافأة المدة غير المؤمَّنة (فوق سن المعاش): ${uncovered} ${currency}.` : ` Uncovered-period gratuity (past retirement age): ${uncovered} ${currency}.`) : '') + extraNote };
}
async function computeAndSaveEOSB(emp, terminationDate, terminationType){
  if(!emp || !emp.hireDate) return;
  const jurisdiction = (state.company && state.company.payrollJurisdiction) || 'EG';
  const baseSalary = Number(emp.baseSalary)||0;
  const result = calcEOSBClient(jurisdiction, baseSalary, emp.hireDate, terminationDate, terminationType, emp);
  const row = {
    company_id: state.session.companyId, employee_id: emp.id, jurisdiction, calculation_method: result.method,
    hire_date: emp.hireDate, last_working_date: terminationDate, years_of_service: result.yearsOfService,
    base_salary: baseSalary, currency: result.currency, gratuity_amount: result.payableGratuity, status:'draft', notes: result.notes,
  };
  const { data, error } = await sb.from('payroll_eosb_ledger').insert(row).select().single();
  if(error){ showToast((state.lang==='ar'?'تعذر حفظ حساب مستحقات نهاية الخدمة: ':'Could not save end-of-service dues: ')+error.message); return; }
  state.eosbLedger.push(eosbLedgerFromRow(data));
  state.ui.eosbResultFor = emp.id;
}
function latestEOSBForEmployee(employeeId){
  const rows = state.eosbLedger.filter(x=>x.employeeId===employeeId);
  if(!rows.length) return null;
  return rows.slice().sort((a,b)=> new Date(a.createdAt) - new Date(b.createdAt)).slice(-1)[0];
}

      </div>

        <button class="btn btn-primary" onclick="closeEOSBResult()">${esc(t('close'))}</button>
      </div>

}

async function createPosition(){

  const title = val('pos_title');

  if(!type){ showToast(t('requiredWarn')); return; }
  appConfirm(t('confirmTerminate'), async ()=>{

function getAnalyticsFilteredEmployees(){
  const f = state.ui.analyticsFilters || {};
  let emps = visibleEmployees();
  if(f.department) emps = emps.filter(e=>e.department===f.department);
  if(f.jobCategory) emps = emps.filter(e=>e.jobCategory===f.jobCategory);
  if(f.contractType) emps = emps.filter(e=>e.contractType===f.contractType);
  if(f.employmentStatus) emps = emps.filter(e=>(e.employmentStatus||'active')===f.employmentStatus);
  if(f.disabilityStatus) emps = emps.filter(e=>(e.disabilityStatus||'none')===f.disabilityStatus);
  if(f.hireYearFrom) emps = emps.filter(e=>e.hireDate && new Date(e.hireDate).getFullYear() >= Number(f.hireYearFrom));
  if(f.hireYearTo) emps = emps.filter(e=>e.hireDate && new Date(e.hireDate).getFullYear() <= Number(f.hireYearTo));
  return emps;
}
function setAnalyticsFilter(key, val){
  state.ui.analyticsFilters = state.ui.analyticsFilters || {};
  state.ui.analyticsFilters[key] = val;
  render();
}
function clearAnalyticsFilters(){
  state.ui.analyticsFilters = { department:'', jobCategory:'', contractType:'', employmentStatus:'', disabilityStatus:'', hireYearFrom:'', hireYearTo:'' };

function exportAnalyticsExcel(){
  const emps = getAnalyticsFilteredEmployees();
  const headers = ['Code','Name','Department','Job Title','Job Category','Contract Type','Employment Status','Hire Date','Termination Date','Termination Type','Base Salary','Currency','Disability Status'];
  const rows = emps.map(e=>[
    e.code||'', e.name||'', e.department||'', e.jobTitle||'', e.jobCategory||'', e.contractType||'',
    e.employmentStatus||'active', e.hireDate||'', e.terminationDate||'', e.terminationType||'',
    e.baseSalary||0, e.payrollCurrency||'', e.disabilityStatus||'none',
  ]);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Analytics');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  triggerDownload(new Blob([wbout], {type:'application/octet-stream'}), 'payroll_analytics_export.xlsx');
}

   UI. Each line is its own row with independent taxable/insurable flags (never

   payroll-calculation engine (further below) reads from to build gross pay,

async function saveComponentForm(){
  const employeeId = state.ui.componentsEmployeeId;
  if(!employeeId) return;
  const editingId = state.ui.componentFormOpen;
  const isNew = editingId === 'new';
  const amountRaw = parseFloat(document.getElementById('cf_amount').value);
  if(isNaN(amountRaw)){ showToast(t('requiredWarn')); return; }
  const comp = {
    id: isNew ? uid() : editingId,
    employeeId,
    componentType: document.getElementById('cf_type').value,
    code: document.getElementById('cf_code').value.trim(),
    nameAr: document.getElementById('cf_name_ar').value.trim(),
    nameEn: document.getElementById('cf_name_en').value.trim(),
    amount: amountRaw,
    isPercentage: document.getElementById('cf_is_pct').checked,
    taxable: document.getElementById('cf_taxable').checked,

/* ============================== Payroll calculation engine ==============================
   Reads: employee master data (Personnel — never re-entered here), the
   employee's own salary components (each independently taxable Y/N and
   insurable Y/N), and the jurisdiction's rates/brackets (Platform Admin →
   Payroll Rates, only usable for a REAL run once tax_rates_verified_at is
   set — see the gate in renderRunPayrollTab). Order matches the requested
   breakdown exactly: Basic → Earnings → Gross → (what's taxed/insured vs
   not) → Deductions → Net.

   Deliberately conservative on anything not fully certain (a specific PWD tax
   exemption figure, minors, continued work past retirement age): rather than
   silently apply a number that might be wrong, this flags the case as a
   warning on the payslip for a human to review — see the `warnings` array. */
function computeProgressiveTax(annualTaxable, brackets){
  if(annualTaxable<=0 || !brackets.length) return 0;
  let tax = 0;
  for(const b of brackets){
    const min = Number(b.min_amount)||0;
    const max = (b.max_amount==null) ? Infinity : Number(b.max_amount);
    if(annualTaxable > min){
      const bandAmount = Math.min(annualTaxable, max) - min;
      if(bandAmount > 0) tax += bandAmount * Number(b.rate);
    }
  }
  return tax;
}
function componentIsEffectiveNow(c){
  const today = toISODate(new Date());
  if(c.effectiveFrom && c.effectiveFrom > today) return false;
  if(c.effectiveTo && c.effectiveTo < today) return false;
  return true;
}
function calculatePayrollForEmployee(emp){
  const jCode = (state.company && state.company.payrollJurisdiction) || 'EG';
  const j = (state.payrollJurisdictions && state.payrollJurisdictions[jCode]) || {};
  const brackets = (state.payrollTaxBrackets||[]).filter(b=>b.jurisdiction_code===jCode);
  const currency = JURISDICTION_CURRENCY[jCode] || '';
  const basic = Number(emp.baseSalary)||0;

  const comps = employeeComponents(emp.id).filter(c=>c.active!==false && componentIsEffectiveNow(c));
  const earningComps = comps.filter(c=>c.componentType==='earning');
  const deductionComps = comps.filter(c=>c.componentType==='deduction');
  const resolveAmount = c => c.isPercentage ? basic*(Number(c.amount)||0)/100 : (Number(c.amount)||0);

  const earningsTotal = earningComps.reduce((s,c)=>s+resolveAmount(c), 0);
  const gross = basic + earningsTotal;

  const warnings = [];
  const notYetInsured = !emp.socialInsuranceRegisteredOn;
  const age = emp.dateOfBirth ? computeAge(emp.dateOfBirth) : null;
  const isUnder18 = age!=null && age<18;
  const retAge = Number(j.retirement_age) || RETIREMENT_AGE_BY_JURISDICTION[jCode] || 60;
  const isPastRetirement = age!=null && age>=retAge;
  const isPwd = emp.disabilityStatus==='pwd';
  if(notYetInsured) warnings.push(t('warnNotYetInsured'));
  if(isUnder18) warnings.push(t('warnUnder18'));
  if(isPastRetirement) warnings.push(t('warnPastRetirement'));
  if(isPwd) warnings.push(t('warnPwdReview'));

  // Insurable wage: basic is always insurable; each earning line only counts
  // if ITS OWN insurable flag says so — then capped to the jurisdiction's
  // min/max insurable wage band (per your confirmed choice: capped at the
  // ceiling, not the full salary, above it).
  const insurableEarnings = earningComps.filter(c=>c.insurable).reduce((s,c)=>s+resolveAmount(c), 0);
  let insurableWage = basic + insurableEarnings;
  const minIns = j.min_insurable_wage!=null ? Number(j.min_insurable_wage) : null;
  const maxIns = j.max_insurable_wage!=null ? Number(j.max_insurable_wage) : null;
  if(maxIns!=null) insurableWage = Math.min(insurableWage, maxIns);
  if(minIns!=null) insurableWage = Math.max(insurableWage, minIns);

  let employeeInsuranceRate = 0, employerInsuranceRate = 0;
  if(!notYetInsured){
    if(emp.isLocalNational){
      employeeInsuranceRate = Number(j.social_insurance_employee_rate_national)||0;
      employerInsuranceRate = Number(j.social_insurance_employer_rate_national)||0;
    } else {
      employeeInsuranceRate = Number(j.social_insurance_employee_rate_expat)||0;
      employerInsuranceRate = Number(j.social_insurance_employer_rate_expat)||0;
    }
  }
  const employeeInsurance = notYetInsured ? 0 : insurableWage*employeeInsuranceRate;
  const employerInsurance = notYetInsured ? 0 : insurableWage*employerInsuranceRate;

  // Taxable wage: same idea — basic always taxable, each earning line only if
  // ITS OWN taxable flag says so.
  const taxableEarnings = earningComps.filter(c=>c.taxable).reduce((s,c)=>s+resolveAmount(c), 0);
  const taxableWage = basic + taxableEarnings;
  let incomeTax = 0;
  if(j.has_progressive_tax && brackets.length){
    const annualTaxable = Math.max(0, (taxableWage*12) - (employeeInsurance*12));
    incomeTax = computeProgressiveTax(annualTaxable, brackets)/12;
  }

  const shuhadaRate = Number(j.shuhada_fund_rate)||0;
  const shuhadaAmount = shuhadaRate>0 ? gross*shuhadaRate : 0;
  const shuhadaBorneByEmployee = j.shuhada_fund_borne_by==='employee';

  const deductionComponentsTotal = deductionComps.reduce((s,c)=>s+resolveAmount(c), 0);
  const totalDeductions = employeeInsurance + incomeTax + deductionComponentsTotal + (shuhadaBorneByEmployee?shuhadaAmount:0);
  const net = gross - totalDeductions;

  return { employeeId:emp.id, currency, basic, earningsTotal, gross,
    insurableWage, employeeInsurance, employerInsurance,
    taxableWage, incomeTax, shuhadaAmount, shuhadaBorneByEmployee,
    deductionComponentsTotal, totalDeductions, net, warnings,
    earningLines: earningComps.map(c=>Object.assign({}, c, {resolvedAmount:resolveAmount(c)})),
    deductionLines: deductionComps.map(c=>Object.assign({}, c, {resolvedAmount:resolveAmount(c)})),
  };
}

async function saveDraftPayrollRun(){
  const jCode = (state.company && state.company.payrollJurisdiction) || 'EG';
  const j = (state.payrollJurisdictions && state.payrollJurisdictions[jCode]) || {};
  if(!j.tax_rates_verified_at){ showToast(t('runPayrollBlockedMsg')); return; }
  const today = new Date();
  const period = state.ui.runPeriod || {};
  const year = period.year || today.getUTCFullYear();
  const month = period.month || (today.getUTCMonth()+1);
  const currency = JURISDICTION_CURRENCY[jCode] || '';
  const { data: runRow, error: runErr } = await sb.from('payroll_runs').insert({
    company_id: state.session.companyId, period_year:year, period_month:month, jurisdiction:jCode,
    currency, status:'draft', run_date: toISODate(new Date()),
  }).select().maybeSingle();
  if(runErr || !runRow){ showToast(runErr ? runErr.message : t('genericError')); return; }
  const emps = visibleEmployees().filter(e=>e.employmentStatus!=='former' && Number(e.baseSalary)>0);
  for(const e of emps){
    const calc = calculatePayrollForEmployee(e);
    const { data: itemRow, error: itemErr } = await sb.from('payroll_items').insert({
      company_id: state.session.companyId, run_id:runRow.id, employee_id:e.id, currency:calc.currency,
      base_salary:calc.basic, total_earnings:calc.earningsTotal, total_deductions:calc.totalDeductions,
      gross_amount:calc.gross, net_amount:calc.net, status:'draft',
    }).select().maybeSingle();
    if(itemErr || !itemRow) continue;
    const lines = [];
    let order = 0;
    calc.earningLines.forEach(l=>lines.push({ company_id:state.session.companyId, item_id:itemRow.id, line_type:'earning',
      code:l.code||'', name_ar:l.nameAr||'', name_en:l.nameEn||'', amount:l.resolvedAmount, currency:calc.currency, taxable:!!l.taxable, sort_order:order++ }));
    lines.push({ company_id:state.session.companyId, item_id:itemRow.id, line_type:'deduction', code:'SOC_INS',
      name_ar:'التأمينات الاجتماعية', name_en:'Social Insurance', amount:calc.employeeInsurance, currency:calc.currency, taxable:false, sort_order:order++ });
    if(calc.incomeTax>0) lines.push({ company_id:state.session.companyId, item_id:itemRow.id, line_type:'deduction', code:'INCOME_TAX',
      name_ar:'ضريبة الدخل', name_en:'Income Tax', amount:calc.incomeTax, currency:calc.currency, taxable:false, sort_order:order++ });
    if(calc.shuhadaBorneByEmployee && calc.shuhadaAmount>0) lines.push({ company_id:state.session.companyId, item_id:itemRow.id, line_type:'deduction', code:'SHUHADA',
      name_ar:'صندوق تكريم الشهداء', name_en:'Shuhada Fund', amount:calc.shuhadaAmount, currency:calc.currency, taxable:false, sort_order:order++ });
    calc.deductionLines.forEach(l=>lines.push({ company_id:state.session.companyId, item_id:itemRow.id, line_type:'deduction',
      code:l.code||'', name_ar:l.nameAr||'', name_en:l.nameEn||'', amount:l.resolvedAmount, currency:calc.currency, taxable:!!l.taxable, sort_order:order++ }));
    if(lines.length) await sb.from('payroll_item_lines').insert(lines);
  }
  showToast('✓ ' + t('runSavedMsg'));
  render();
}

/* ============================== Leave module ==============================
   Deliberately a tracking tool, not a law engine: entitlement figures are
   editable reference defaults (LEAVE_TYPE_REFERENCE above), never silently
   computed from a legal rule this app can't fully verify (see the same
   reasoning as the payroll-rates caution). expected_return_date on a leave
   record is what the Reminders tab below watches for a "returning from long
   leave" alert. */
async function ensureLeaveDataLoaded(){
  if(state.ui.leaveLoaded) return;
  const [records, balances] = await Promise.all([
    sb.from('employee_leave_records').select('*').order('start_date', {ascending:false}),
    sb.from('employee_annual_leave_balances').select('*').order('period_year', {ascending:false}),
  ]);
  state.leaveRecords = (records.data||[]).map(leaveRecordFromRow);
  state.leaveBalances = (balances.data||[]).map(leaveBalanceFromRow);
  state.ui.leaveLoaded = true;
  render();
}

/* ============================== Reminders ==============================
   Computed entirely client-side from data already in the app (contract end
   dates, probation due dates, computed retirement date, leave expected-return
   dates) — no outbound email is actually sent from here yet (that needs a
   real email-sending account, e.g. Resend, which this session has no
   credentials for). What this DOES give HR right now: a always-accurate due
   list, and a one-click mailto: that opens the user's own mail client with
   the notify list and a ready-made subject/body, plus a log of what's been
   sent (hr_reminders_log) so the same reminder isn't repeated needlessly. */
async function ensureReminderDataLoaded(){
  if(state.ui.remindersLoaded) return;
  const [settings, log] = await Promise.all([
    sb.from('hr_reminder_settings').select('*').eq('company_id', state.session.companyId).maybeSingle(),
    sb.from('hr_reminders_log').select('*').order('sent_at', {ascending:false}).limit(200),
  ]);
  state.reminderSettings = settings.data
    ? { enabled:settings.data.enabled, leadDaysStage1:settings.data.lead_days_stage1, leadDaysStage2:settings.data.lead_days_stage2, notifyEmails:(settings.data.notify_emails||[]).join(', ') }
    : { enabled:true, leadDaysStage1:30, leadDaysStage2:15, notifyEmails:'' };
  state.remindersLog = log.data||[];
  if(!probationEvals.length && !state.ui.probationLoaded) await loadProbationEvaluations();
  await ensureLeaveDataLoaded();
  state.ui.remindersLoaded = true;
  render();
}
function openRemindersTab(){ ensureReminderDataLoaded(); }
function setReminderSettingField(field, value){ state.reminderSettings[field] = value; render(); }
async function saveReminderSettings(){

  const { error } = await sb.from('hr_reminder_settings').upsert({
    company_id: state.session.companyId, enabled:!!s.enabled,
    lead_days_stage1: parseInt(s.leadDaysStage1,10)||30, lead_days_stage2: parseInt(s.leadDaysStage2,10)||15,

}
function retirementDateISO(emp){
  if(!emp.dateOfBirth) return null;
  const d = new Date(emp.dateOfBirth+'T00:00:00Z'); if(isNaN(d)) return null;
  const jCode = (state.company && state.company.payrollJurisdiction) || 'EG';
  const j = (state.payrollJurisdictions && state.payrollJurisdictions[jCode]) || {};
  const retAge = Number(j.retirement_age) || RETIREMENT_AGE_BY_JURISDICTION[jCode] || 60;
  return toISODate(new Date(Date.UTC(d.getUTCFullYear()+retAge, d.getUTCMonth(), d.getUTCDate())));
}
function computeDueReminders(){
  const leadDays = (state.reminderSettings && state.reminderSettings.leadDaysStage1) || 30;
  const todayISO = toISODate(new Date());
  const cutoffISO = toISODate(new Date(Date.now() + leadDays*86400000));
  const out = [];
  visibleEmployees().filter(e=>e.employmentStatus!=='former').forEach(e=>{
    if(e.contractEndDate && e.contractEndDate>=todayISO && e.contractEndDate<=cutoffISO){
      out.push({ type:'contract', employee:e, dueDate:e.contractEndDate, label:t('reminderContractRenewal') });
    }
    const retDate = retirementDateISO(e);
    if(retDate && retDate>=todayISO && retDate<=cutoffISO){
      out.push({ type:'retirement', employee:e, dueDate:retDate, label:t('reminderRetirement') });
    }
  });
  (probationEvals||[]).filter(p=>p.status!=='completed').forEach(p=>{
    if(p.due_date && p.due_date>=todayISO && p.due_date<=cutoffISO){
      const emp = employeeById(p.employee_id);
      if(emp) out.push({ type:'probation', employee:emp, dueDate:p.due_date, label:t('reminderProbationEnd') });
    }
  });
  (state.leaveRecords||[]).filter(r=>['scheduled','active'].includes(r.status) && r.expectedReturnDate).forEach(r=>{
    if(r.expectedReturnDate>=todayISO && r.expectedReturnDate<=cutoffISO){
      const emp = employeeById(r.employeeId);
      if(emp) out.push({ type:'leaveReturn', employee:emp, dueDate:r.expectedReturnDate, label:t('reminderLeaveReturn') });
    }
  });
  out.sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  return out;
}
function reminderMailto(item){
  const s = state.reminderSettings;

  const subject = `${item.label} — ${item.employee.name}`;
  const body = state.lang==='ar'
    ? `تذكير: ${item.label} للموظف ${item.employee.name} (${item.employee.code||''}) بتاريخ ${item.dueDate}.`
    : `Reminder: ${item.label} for ${item.employee.name} (${item.employee.code||''}) on ${item.dueDate}.`;
  return `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

async function handleDocUpload(evt, employeeId){
  const file = evt.target.files[0];
  if(!file) return;
  const docType = (document.getElementById('doc_type_select')||{}).value || 'other';
  const companyId = state.session.companyId;
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `${companyId}/${employeeId}/${Date.now()}_${safeName}`;
  showToast(state.lang==='ar' ? 'جارِ الرفع...' : 'Uploading...');
  const { error: upErr } = await sb.storage.from('employee-documents').upload(path, file, { contentType: file.type || undefined });
  if(upErr){ showToast(upErr.message); return; }
  const { error: dbErr } = await sb.from('employee_documents').insert({
    company_id: companyId, employee_id: employeeId, doc_type: docType,
    file_name: file.name, storage_path: path, mime_type: file.type || null, file_size: file.size || null,
  });
  if(dbErr){ showToast(dbErr.message); return; }
  evt.target.value = '';
  showToast('✓ ' + (state.lang==='ar' ? 'تم رفع الملف' : 'File uploaded'));
  loadEmployeeDocuments(employeeId);

/* ---- Payroll data Excel import (separate from the Employee Database import in
   Step 1 — that one creates NEW employees; this one only UPDATES payroll fields
   on employees that already exist, matched by their employee Code). Same
   library (SheetJS/XLSX), same map-then-import shape as renderExcelImport(). ---- */
const PAYROLL_EXCEL_FIELD_KEYWORDS = {
  code:['code','كود'],
  baseSalary:['base salary','basic salary','salary','الراتب الاساسي','الراتب الأساسي','راتب'],
  payrollCurrency:['currency','عملة'],
  dateOfBirth:['date of birth','birth date','dob','تاريخ الميلاد','ميلاد'],
  isLocalNational:['local national','nationality','national','مواطن','جنسية'],
  socialInsuranceRegisteredOn:['social insurance','insurance registration','تأمينات','تسجيل التأمين'],
  contractEndDate:['contract end','end date','انتهاء العقد','نهاية العقد'],
  disabilityStatus:['disability status','disability','اعاقة','إعاقة','ذوي الهمم'],
  disabilityCardNumber:['disability card','card number','كارت الاعاقة','رقم الكارت'],
};
function autoMapPayrollExcelHeaders(headers){
  const mapping = {};
  const used = new Set();
  Object.keys(PAYROLL_EXCEL_FIELD_KEYWORDS).forEach(key=>{
    const keywords = PAYROLL_EXCEL_FIELD_KEYWORDS[key];
    const match = headers.find(h=>{
      if(used.has(h)) return false;
      const s = String(h).toLowerCase();
      return keywords.some(k=>s.includes(k));
    });
    if(match){ mapping[key] = match; used.add(match); }
  });
  return mapping;
}
function normalizeYesNo(v){
  const s = String(v||'').trim().toLowerCase();
  return ['yes','y','true','1','نعم','ايوه','أيوه'].includes(s);
}
function normalizeDisabilityStatus(v){
  const s = String(v||'').trim().toLowerCase();
  if(['pwd','disabled','معاق','اعاقة','إعاقة','ذوي الهمم'].some(k=>s.includes(k))) return 'pwd';
  if(['caregiver','راعي','مرافق','رعاية'].some(k=>s.includes(k))) return 'caregiver';
  return 'none';
}
function normalizeMaritalStatus(v){
  const s = String(v||'').trim().toLowerCase();
  if(['married','متزوج','متجوز'].some(k=>s.includes(k))) return 'married';
  if(['divorced','مطلق'].some(k=>s.includes(k))) return 'divorced';
  if(['widow','ارمل','أرمل'].some(k=>s.includes(k))) return 'widowed';
  if(['single','اعزب','أعزب','عزباء','عازب'].some(k=>s.includes(k))) return 'single';
  return '';
}
function downloadPayrollDataTemplate(){
  const headers = ['Code','Base Salary','Currency (EGP/SAR/AED)','Date of Birth (YYYY-MM-DD)','Local National (Yes/No)',
    'Social Insurance Registration Date (YYYY-MM-DD)','Contract End Date (YYYY-MM-DD)','Disability Status (none/pwd/caregiver)','Disability Card Number'];
  const sample = ['E-1001','12000','EGP','1990-05-14','Yes','2015-03-01','','none',''];
  const ws = XLSX.utils.aoa_to_sheet([headers, sample]);
  ws['!cols'] = headers.map(()=>({wch:26}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Payroll Data Template');
  const wbout = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  triggerDownload(new Blob([wbout], {type:'application/octet-stream'}), 'payroll_data_template.xlsx');
}
function handlePayrollExcelFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    showToast(state.lang==='ar' ? 'تعذّر تحميل مكتبة قراءة الإكسل — تأكد من اتصالك بالإنترنت وأعد المحاولة' : 'The Excel library failed to load — check your internet connection and try again');
    return;
  }
  state.ui.payrollExcelFileName = file.name;
  render();
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array', cellDates:true});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ showToast(t('dataMissing')); return; }
      const headers = Object.keys(rows[0]);
      state.ui.payrollExcelHeaders = headers;
      state.ui.payrollExcelRows = rows;
      state.ui.payrollMapping = autoMapPayrollExcelHeaders(headers);
      render();
      showToast(state.lang==='ar' ? '✓ تم قراءة الملف — راجع الربط ثم اضغط "استيراد بيانات الرواتب"' : '✓ File read — review the mapping, then click "Import Payroll Data"');
    }catch(err){
      showToast((state.lang==='ar' ? 'تعذّرت قراءة الملف: ' : 'Could not read the file: ') + (err && err.message ? err.message : err));
    }
  };
  reader.onerror = function(){
    showToast(state.lang==='ar' ? 'تعذّرت قراءة الملف من المتصفح' : 'The browser could not read this file');
  };
  reader.readAsArrayBuffer(file);
}

function matchEmployeeByCode(code){
  const s = String(code||'').trim().toLowerCase();
  if(!s) return null;
  return state.employees.find(e=>String(e.code||'').trim().toLowerCase()===s) || null;
}
function payrollImportPreviewRows(){
  const m = state.ui.payrollMapping;
  if(!m.code) return [];
  return state.ui.payrollExcelRows.map(row=>{
    const code = String(row[m.code]||'');
    return { code, employee: matchEmployeeByCode(code) };
  });
}
async function importPayrollExcelData(){
  if(!isAdmin()){ showToast(t('permissionDenied')); return; }
  const m = state.ui.payrollMapping;
  if(!m.code){ showToast(t('requiredWarn')); return; }
  const rows = state.ui.payrollExcelRows;
  const jobs = [];
  let matched = 0;
  const patchedLocally = [];
  rows.forEach(row=>{
    const emp = matchEmployeeByCode(row[m.code]);
    if(!emp) return;
    matched++;
    const update = {};
    if(m.baseSalary){ const n = parseFloat(row[m.baseSalary]); if(!isNaN(n)) update.base_salary = n; }
    if(m.payrollCurrency){ const c = String(row[m.payrollCurrency]||'').trim().toUpperCase(); if(c) update.payroll_currency = c; }
    if(m.dateOfBirth){ const d = excelValueToISODate(row[m.dateOfBirth]); if(d) update.date_of_birth = d; }
    if(m.isLocalNational){ const v = row[m.isLocalNational]; if(String(v||'').trim()!=='') update.is_local_national = normalizeYesNo(v); }
    if(m.socialInsuranceRegisteredOn){ const d = excelValueToISODate(row[m.socialInsuranceRegisteredOn]); if(d) update.social_insurance_registered_on = d; }
    if(m.contractEndDate){ const d = excelValueToISODate(row[m.contractEndDate]); if(d) update.contract_end_date = d; }
    if(m.disabilityStatus){ const v = row[m.disabilityStatus]; if(String(v||'').trim()!=='') update.disability_status = normalizeDisabilityStatus(v); }
    if(m.disabilityCardNumber){ const v = String(row[m.disabilityCardNumber]||'').trim(); if(v) update.disability_card_number = v; }
    if(Object.keys(update).length===0) return;
    jobs.push(sb.from('employees').update(update).eq('id', emp.id));
    patchedLocally.push({ id: emp.id, update });
  });
  if(matched===0){ showToast(t('noMatchedEmployees')); return; }
  const results = await Promise.all(jobs);
  const failed = results.filter(r=>r.error);
  // Reflect the successful updates immediately in local state (camelCase),
  // instead of waiting on a full reload, for a responsive UI.
  patchedLocally.forEach(({id, update})=>{
    const emp = state.employees.find(e=>e.id===id);
    if(!emp) return;
    if('base_salary' in update) emp.baseSalary = update.base_salary;
    if('payroll_currency' in update) emp.payrollCurrency = update.payroll_currency;
    if('date_of_birth' in update) emp.dateOfBirth = update.date_of_birth;
    if('is_local_national' in update) emp.isLocalNational = update.is_local_national;
    if('social_insurance_registered_on' in update) emp.socialInsuranceRegisteredOn = update.social_insurance_registered_on;
    if('contract_end_date' in update) emp.contractEndDate = update.contract_end_date;
    if('disability_status' in update) emp.disabilityStatus = update.disability_status;
    if('disability_card_number' in update) emp.disabilityCardNumber = update.disability_card_number;
  });
  state.ui.payrollExcelHeaders = []; state.ui.payrollExcelRows = []; state.ui.payrollMapping = {}; state.ui.payrollExcelFileName = '';
  render();
  if(failed.length){
    showToast((state.lang==='ar'?'تم تحديث ':'Updated ')+(matched-failed.length)+(state.lang==='ar'?` موظف — فشل تحديث ${failed.length}`:` employees — ${failed.length} failed`));
  } else {
    showToast((state.lang==='ar'?'✓ تم تحديث بيانات الرواتب لـ ':'✓ Updated payroll data for ')+matched+(state.lang==='ar'?' موظف':' employees'));
  }
}

/* ============================== Platform-owner-only: payroll jurisdiction rates ==============================
   See the payroll_calc_engine_rates migration for the full reasoning: this is
   shared legal/statutory reference data used by every tenant company in a
   given country, so it is deliberately NOT editable by ordinary company
   admins — only here, gated exactly like the rest of Platform Admin
   (is_platform_owner(), re-checked server-side in every RPC below). Every
   rate is shown with an explicit "verified / not yet verified" state — never
   silently presented as authoritative — because payroll correctness is not
   something to get subtly wrong. */
async function loadPlatformPayrollRates(){
  const { data, error } = await sb.rpc('platform_list_payroll_jurisdictions');
  if(error){ showToast(error.message); return; }
  platformJurisdictions = data||[];
  const { data: brackets } = await sb.from('payroll_tax_brackets').select('*').order('bracket_order');
  platformTaxBrackets = brackets||[];
  state.ui.platformJurisdictionEdits = {};
  platformJurisdictions.forEach(j=>{
    state.ui.platformJurisdictionEdits[j.code] = {
      social_insurance_employee_rate_national: j.social_insurance_employee_rate_national,
      social_insurance_employer_rate_national: j.social_insurance_employer_rate_national,
      social_insurance_employee_rate_expat: j.social_insurance_employee_rate_expat,
      social_insurance_employer_rate_expat: j.social_insurance_employer_rate_expat,
      has_progressive_tax: !!j.has_progressive_tax,
      shuhada_fund_rate: j.shuhada_fund_rate,
      shuhada_fund_borne_by: j.shuhada_fund_borne_by || 'employer',
      min_insurable_wage: j.min_insurable_wage,
      max_insurable_wage: j.max_insurable_wage,
      min_statutory_wage: j.min_statutory_wage,
      retirement_age: j.retirement_age,
      rates_source_note: j.rates_source_note || '',
      mark_verified: false,
    };
  });
}
function setJurisdictionEditField(code, field, value){
  const ed = state.ui.platformJurisdictionEdits[code];

  const numericFields = ['social_insurance_employee_rate_national','social_insurance_employer_rate_national','social_insurance_employee_rate_expat','social_insurance_employer_rate_expat','shuhada_fund_rate','min_insurable_wage','max_insurable_wage','min_statutory_wage','retirement_age'];
  if(field==='has_progressive_tax'){ ed[field] = value; }

    p_code: code,
    p_social_insurance_employee_rate_national: ed.social_insurance_employee_rate_national,
    p_social_insurance_employer_rate_national: ed.social_insurance_employer_rate_national,

  state.ui.newBracketDrafts[code] = state.ui.newBracketDrafts[code] || [];

/* Payment status is computed purely from paid_until (a date Mohamed extends
   manually via platform_record_payment) — never paid = still on trial,
   in the future = active, within a week = expiring soon, in the past = expired.
   Nothing here auto-downgrades an expired company; that stays a deliberate
   manual step (switch its plan back to trial in the row above) so no one
   gets locked out by a missed payment automatically. */
function paymentStatusInfo(c){
  if(!c.paid_until) return { key:'platformStatusNeverPaid', cls:'badge-navy' };
  const today = new Date(); today.setHours(0,0,0,0);
  const until = new Date(c.paid_until+'T00:00:00');
  const daysLeft = Math.round((until-today)/86400000);
  if(daysLeft < 0) return { key:'platformStatusExpired', cls:'badge-red' };
  if(daysLeft <= 7) return { key:'platformStatusExpiringSoon', cls:'badge-orange' };
  return { key:'platformStatusActive', cls:'badge-green' };
}

  const amountEl = document.getElementById('pf_amount');
  if(amountEl) amountEl.value = tier.priceEgp;
}

    p_company_id: companyId, p_amount: amount, p_method: method, p_note: note||null, p_extend_days: extendDays

}
