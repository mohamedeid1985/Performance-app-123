<style>
  :root{
    --navy:#1E2761; --navy-dark:#12173F; --navy-light:#2E3A8C;
    --gold:#C99A3B; --gold-light:#E8C878;
    --ice:#DDE3F9; --bg:#F4F6FB; --card:#FFFFFF; --border:#E2E6EF;
    --text:#1F2430; --gray:#6B7280;
    --green:#2E7D5B; --green-bg:#E7F4EE;
    --orange:#C97A4A; --orange-bg:#FBEEE6;
    --red:#B33A3A; --red-bg:#FBEAEA;
    --amber:#C99A3B; --amber-bg:#FBF3E1;
    --radius:10px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(30,39,97,0.08), 0 1px 2px rgba(30,39,97,0.06);
    --shadow-md:0 4px 14px rgba(18,23,63,0.10), 0 2px 6px rgba(18,23,63,0.06);
    --shadow-lg:0 12px 32px rgba(18,23,63,0.16), 0 4px 10px rgba(18,23,63,0.08);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
      --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
      --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
    }
  }
  :root[data-theme="dark"] {
    --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
    --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
    --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Cairo', Arial, Tahoma, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);}
  [dir="ltr"] body{font-family:'Cairo', Arial, sans-serif;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold-light); color:var(--navy-dark);}

  /* Accessible focus ring, everywhere, keyboard-only */
  *:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:50; box-shadow:var(--shadow-md);
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(155deg, var(--gold-light), var(--gold));
    display:flex; align-items:center; justify-content:center; color:var(--navy-dark); font-weight:800; font-size:18px;
    flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.1px;}
  .brand-text p{font-size:11.5px; margin:0; opacity:0.75;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .pill-btn{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff;
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;
    transition:background .18s var(--ease), transform .12s var(--ease);
  }
  .pill-btn:hover{background:rgba(255,255,255,0.22); transform:translateY(-1px);}
  .pill-btn:active{transform:translateY(0);}
  /* Icon-only topbar buttons (theme/lang toggles) — solid white squares, matching the Figma redesign's topbar */
  .icon-pill{
    background:#fff; border:none; color:var(--navy); padding:8px 12px; border-radius:8px;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; box-shadow:0 1px 2px rgba(0,0,0,0.06);
    transition:transform .12s var(--ease), box-shadow .16s var(--ease);
  }
  .icon-pill:hover{transform:translateY(-1px); box-shadow:0 3px 8px rgba(0,0,0,0.14);}
  .icon-pill:active{transform:translateY(0);}

  .stepper{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--border);
    overflow-x:auto; position:sticky; top:66px; z-index:40; scrollbar-width:thin;
  }
  .step-item{
    flex:1; min-width:128px; padding:11px 12px; text-align:center; position:relative;
    font-size:12px; font-weight:700; color:var(--gray); display:flex; flex-direction:column; align-items:center; gap:4px;
    white-space:nowrap; transition:color .18s var(--ease), background .18s var(--ease);
  }
  .step-item::after{
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:0; height:3px;
    background:var(--gold); border-radius:3px 3px 0 0; transition:width .22s var(--ease);
  }
  .step-item .num{
    width:24px; height:24px; border-radius:50%; background:var(--border); color:var(--gray);
    display:flex; align-items:center; justify-content:center; font-size:13px; transition:background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease);
  }
  .step-item.active{color:var(--navy); background:linear-gradient(180deg, rgba(201,154,59,0.06), transparent);}
  .step-item.active::after{width:56%;}
  .step-item.active .num{background:var(--navy); color:#fff; transform:scale(1.06);}
  .step-item.done .num{background:var(--green); color:#fff;}
  .step-item.clickable{cursor:pointer;}
  .step-item.clickable:hover{color:var(--navy); background:rgba(201,154,59,0.05);}

  main{max-width:1180px; margin:0 auto; padding:22px 18px 60px;}
  @keyframes stepFadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  main.step-anim{animation:stepFadeIn .3s var(--ease);}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:21px; margin:0 0 4px; color:var(--navy); font-weight:800; letter-spacing:-.2px;}
  .section-head p{font-size:13px; color:var(--gray); margin:0;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; transition:box-shadow .2s var(--ease);}
  .card h3{margin:0 0 12px; font-size:15px; color:var(--navy); font-weight:800;}
  .card-flat{background:var(--ice); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px;}

  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{
    padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:13px; font-weight:700; transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease), transform .12s var(--ease);
  }
  .tab-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--gray); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease); min-height:38px;
  }
  .field input:hover, .field select:hover{border-color:var(--gold-light);}
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}

  .btn{
    padding:10px 18px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s var(--ease), box-shadow .18s var(--ease), background .16s var(--ease), opacity .16s var(--ease);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(30,39,97,0.25);}
  .btn-primary:hover{background:var(--navy-light); box-shadow:0 4px 14px rgba(30,39,97,0.32);}
  .btn-gold{background:linear-gradient(155deg, var(--gold-light), var(--gold)); color:var(--navy-dark); box-shadow:0 2px 8px rgba(201,154,59,0.3);}
  .btn-gold:hover{box-shadow:0 4px 14px rgba(201,154,59,0.4);}
  .btn-outline{background:transparent; border:1.5px solid var(--navy); color:var(--navy);}
  .btn-outline:hover{background:rgba(30,39,97,0.06);}
  .btn-ghost{background:var(--border); color:var(--text);}
  .btn-danger{background:var(--red-bg); color:var(--red); border:1px solid var(--red);}
  .btn-export-excel{background:transparent; border:1.5px solid var(--green); color:var(--green);}
  .btn-export-excel:hover{background:var(--green-bg);}
  .btn-export-pdf{background:transparent; border:1.5px solid var(--red); color:var(--red);}
  .btn-export-pdf:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 10px; text-align:start; border-bottom:1px solid var(--border);}
  th{background:var(--ice); color:var(--navy); font-size:11px; font-weight:800; white-space:nowrap; letter-spacing:.1px; position:sticky; top:0;}
  tbody tr{transition:background .12s var(--ease);}
  tr:hover td{background:rgba(221,227,249,0.35);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; max-height:520px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800;}
  .badge-green{background:var(--green-bg); color:var(--green);}
  .badge-amber{background:var(--amber-bg); color:var(--amber);}
  .badge-orange{background:var(--orange-bg); color:var(--orange);}
  .badge-red{background:var(--red-bg); color:var(--red);}
  .badge-navy{background:var(--ice); color:var(--navy);}

  .method-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:900px){.method-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.method-grid{grid-template-columns:repeat(2,1fr);}}
  .method-card{
    border:2px solid var(--border); border-radius:var(--radius); padding:14px 10px; text-align:center; background:var(--card);
    transition:border-color .18s var(--ease), transform .16s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  }
  .method-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md); border-color:var(--gold-light);}
  .method-card .mi{font-size:22px; margin-bottom:6px; transition:transform .18s var(--ease);}
  .method-card:hover .mi{transform:scale(1.12);}
  .method-card .mt{font-weight:800; font-size:13px; color:var(--navy);}
  .method-card .md{font-size:10.5px; color:var(--gray); margin-top:3px;}
  .method-card.selected{border-color:var(--navy); background:var(--navy); box-shadow:0 0 0 3px rgba(30,39,97,0.18), var(--shadow-md); transform:translateY(-2px);}
  .method-card.selected .mt{color:#fff;}
  .method-card.selected .md{color:rgba(255,255,255,0.75);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--gray); border:1.5px dashed var(--border); border-radius:var(--radius); background:rgba(202,220,252,0.06);}
  .empty-state .ei{font-size:32px; margin-bottom:10px; opacity:.85;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; justify-content:space-between;}
  .toolbar .left{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  .kv-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;}
  .kv-row span:first-child{color:var(--gray);}
  .kv-row span:last-child{font-weight:700;}

  .score-hero{
    display:flex; align-items:center; gap:22px; background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff; border-radius:var(--radius); padding:24px; margin-bottom:16px; flex-wrap:wrap; box-shadow:var(--shadow-lg);
  }
  .score-circle{
    width:110px; height:110px; border-radius:50%; border:6px solid var(--gold); display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,0.05);
  }
  .score-circle b{font-size:26px;}
  .score-circle span{font-size:10.5px; opacity:0.8;}
  .score-info h3{margin:0 0 4px; font-size:17px;}
  .score-info p{margin:0; font-size:12.5px; opacity:0.85;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(6px); background:var(--navy); color:#fff;
    padding:11px 20px; border-radius:10px; font-size:13px; font-weight:700; z-index:200; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease), transform .22s var(--ease);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,45,0.55); z-index:150; display:flex; align-items:center; justify-content:center; padding:16px;
    animation:overlayIn .18s var(--ease);
  }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalIn{ from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal{background:var(--card); border-radius:var(--radius); padding:20px; max-width:520px; width:100%; max-height:85vh; overflow:auto; box-shadow:var(--shadow-lg); animation:modalIn .2s var(--ease);}
  .modal h3{margin-top:0; color:var(--navy);}

  .card-warn{
    display:flex; align-items:center; gap:10px; background:var(--amber-bg); border:1px solid rgba(201,154,59,0.35);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px; color:#8a6a17; font-size:12.5px; font-weight:600; line-height:1.7;
  }
  :root[data-theme="dark"] .card-warn{ color:#E8C878; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card-warn{ color:#E8C878; } }
  .hint{font-size:11.5px; color:var(--gray); margin-top:4px; line-height:1.6;}
  .divider{height:1px; background:var(--border); margin:16px 0;}
  .row-actions{display:flex; gap:6px;}
  .weight-warning{color:var(--red); font-size:12px; font-weight:700;}
  .explain-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.explain-grid{grid-template-columns:1fr;}}

  .org-tree{overflow-x:auto;}
  .org-node{margin-bottom:4px;}
  .org-node-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer;
    transition:background .15s var(--ease); border:1px solid transparent;
  }
  .org-node-row:hover{background:var(--ice); border-color:var(--border);}
  .org-node-match{background:var(--amber-bg); border-color:var(--gold);}
  .org-node-root:not(.org-node-match){border-color:var(--gold-light);}
  .org-toggle{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--navy);
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s var(--ease);
  }
  .org-toggle:hover{background:var(--ice);}
  .org-toggle-spacer{width:22px; flex-shrink:0;}
  .org-avatar{
    width:32px; height:32px; border-radius:50%; background:linear-gradient(155deg,var(--navy-light),var(--navy)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;
  }
  .org-node-info{min-width:0;}
  .org-node-name{font-weight:800; font-size:13.5px; color:var(--text); white-space:nowrap;}
  .org-node-meta{font-size:11px; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .org-children{border-inline-start:2px solid var(--border); padding-inline-start:6px; margin-inline-start:15px;}

  @media (max-width:640px){
    main{padding:16px 12px 50px;}
    .card, .card-flat{padding:14px;}
    .btn{padding:9px 14px;}
  }

  @media print{
    .topbar, .stepper, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%; padding:0;}
    .print-sheet{display:block !important;}
  }
  .print-sheet{display:none;}
</style>

</head>

/* IDs must be real UUIDs now: employees/job_families/job_levels/cost_centers
   all have a Postgres `uuid` primary key, and every id created client-side
   (new employee, new cost center, ...) gets upserted straight into it. */
function uid(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3|0x8); return v.toString(16);
  });
}

/* Loads every table into `state` after a successful sign-in. */
async function loadAllData(){
  const [profiles, employees, depts, families, levels, ccs, evals, settings] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('employees').select('*'),
    sb.from('departments').select('*'),
    sb.from('job_families').select('*'),
    sb.from('job_levels').select('*').order('rank'),
    sb.from('cost_centers').select('*'),
    sb.from('evaluations').select('*'),
    sb.from('app_settings').select('*').eq('id',1).maybeSingle(),
  ]);
  state.users = (profiles.data||[]).map(userFromRow);
  state.employees = (employees.data||[]).map(empFromRow);
  state.departments = {};
  (depts.data||[]).forEach(r=>{ state.departments[r.name] = deptFromRow(r); });
  state.jobFamilies = (families.data||[]).map(familyFromRow);
  state.jobLevels = (levels.data||[]).map(levelFromRow);
  state.costCenters = (ccs.data||[]).map(ccFromRow);
  state.evaluations = {};
  (evals.data||[]).forEach(r=>{ state.evaluations[r.employee_id] = { method:r.method, data:r.data||{}, score:r.score, date:r.eval_date, evaluatedBy:r.evaluated_by||'' }; });
  if(settings.data){ state.gradeMap = settings.data.grade_map||{}; state.familyMap = settings.data.family_map||{}; state.templates = settings.data.templates||{kpi:[],mbo:[],bars:[],'360':[]}; }
  ensureJobLevelPerms();
  // A brand-new, never-seeded database: seed the default job families/levels
  // once, and push them straight to Supabase so every future sign-in sees them.
  if(state.jobFamilies.length===0 && state.jobLevels.length===0){
    seedJobArchitectureDefaults();
    await Promise.all([
      sb.from('job_families').upsert(state.jobFamilies.map(f=>({id:f.id,name:f.name,archived:f.archived}))),
      sb.from('job_levels').upsert(state.jobLevels.map(l=>({id:l.id,name:l.name,rank:l.rank,active:l.active,perms:l.perms}))),
    ]);
  }
}

/* Pushes the CURRENT in-memory arrays/objects back to Supabase. This mirrors
   the old saveState()'s "persist everything after every render" behavior,
   but as upserts against the shared database instead of one localStorage
   blob. Row deletions are handled separately, right where an item is removed
   from state (see deleteEmployee/deleteUser/deleteFamily/... ), since an
   upsert alone can never remove a row. Best-effort and fire-and-forget, same
   as the old saveState — a transient network hiccup must never block the UI. */
let __syncTimer = null;
function syncStateToSupabase(){
  if(!isLoggedIn()) return;
  clearTimeout(__syncTimer);
  __syncTimer = setTimeout(doSyncStateToSupabase, 150);
}
async function doSyncStateToSupabase(){
  try{
    const jobs = [];
    if(state.employees.length) jobs.push(sb.from('employees').upsert(state.employees.map(empToRow)));
    // profiles are intentionally NOT synced here: every profile change goes
    // through admin_update_user / update_own_name / bootstrap_own_profile,
    // since those are the only paths the database's RLS policies allow.
    const deptRows = Object.keys(state.departments).map(name=>deptToRow(name, state.departments[name]));
    if(deptRows.length) jobs.push(sb.from('departments').upsert(deptRows));
    if((state.jobFamilies||[]).length) jobs.push(sb.from('job_families').upsert(state.jobFamilies.map(f=>({id:f.id,name:f.name,archived:f.archived}))));
    if((state.jobLevels||[]).length) jobs.push(sb.from('job_levels').upsert(state.jobLevels.map(l=>({id:l.id,name:l.name,rank:l.rank,active:l.active,perms:l.perms}))));
    if((state.costCenters||[]).length) jobs.push(sb.from('cost_centers').upsert(state.costCenters.map(ccToRow)));
    const evalRows = Object.keys(state.evaluations).map(empId=>evalToRow(empId, state.evaluations[empId]));
    if(evalRows.length) jobs.push(sb.from('evaluations').upsert(evalRows));
    jobs.push(sb.from('app_settings').upsert({id:1, grade_map:state.gradeMap||{}, family_map:state.familyMap||{}, templates:state.templates||{kpi:[],mbo:[],bars:[],'360':[]}}));
    await Promise.all(jobs);
  }catch(e){ /* best-effort, same spirit as the old saveState()'s silent catch */ }
}
/* Kept as the persistence entry point everywhere else in this file already
   calls it (every render() call used to end with saveState()) — now it syncs
   to Supabase instead of localStorage, only once actually signed in. */
function saveState(){ syncStateToSupabase(); }

/* ============================== Permissions (client-side scoping only — NOT secure auth) ============================== */
function currentUser(){
  if(!state.session.userId) return null;
  return state.users.find(u=>u.id===state.session.userId) || null;
}
function isLoggedIn(){ return !!state.session.userId; }
function isAdmin(){ const u=currentUser(); return !u || u.role==='admin'; }
function userScopeAllowsEmployee(user, emp){
  if(!user || user.role==='admin') return true;
  if(!emp) return false;
  if(user.role==='manager' || user.role==='sectionhead') return (emp.department||'')===(user.department||'');
  if(user.role==='supervisor') return (emp.department||'')===(user.department||'') && (emp.managerName||'')===(user.name||'');
  /* Department followers: a user listed as a "follower"/monitor of a department
     (state.departments[dept].followers, an array of user ids — several people
     can follow the same department) gets read/oversight visibility into that
     department's employees, on top of whatever their role already grants. */
  if(isDeptFollower(user.id, emp.department)) return true;
  return false;
}
function isDeptFollower(userId, deptName){
  if(!userId || !deptName) return false;
  const rec = state.departments[deptName];
  return !!(rec && Array.isArray(rec.followers) && rec.followers.includes(userId));
}
/* Grade-based permissions are an ADDITIONAL layer on top of the per-user
   checkboxes, not a replacement: a user gets an action if their own perms
   grant it OR their assigned Job Grade's default permissions grant it.
   The grade's permission set lives on the job level record itself
   (state.jobLevels[i].perms) — the single source of truth, same place the
   grade's name/rank already live — never duplicated onto each user. */
function gradePermGrant(user, action){
  if(!user || !user.grade) return false;
  const lvl = (state.jobLevels||[]).find(l=>l.name===user.grade);
  return !!(lvl && lvl.perms && lvl.perms[action]);
}
function hasPerm(action, emp){
  const u = currentUser();
  if(!u) return true;
  if(u.role==='admin') return true;
  if(emp && !userScopeAllowsEmployee(u, emp)) return false;
  return !!((u.perms && u.perms[action]) || gradePermGrant(u, action));
}
function visibleEmployees(){
  const u = currentUser();
  if(!u || u.role==='admin') return state.employees;
  return state.employees.filter(e=>userScopeAllowsEmployee(u,e));
}
function roleLabel(r){
  const map = {
    admin:{ar:'مدير النظام (كل الصلاحيات)',en:'Admin (full access)'},
    manager:{ar:'مدير القسم',en:'Department Manager'},
    sectionhead:{ar:'رئيس القسم',en:'Section Head'},
    supervisor:{ar:'مشرف',en:'Supervisor'},
  };
  return map[r] ? map[r][state.lang] : r;
}

/* ============================== Helpers ============================== */
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}
/* Custom confirm modal — native confirm()/alert() are unreliable inside a sandboxed
   artifact iframe (can silently no-op), so every yes/no confirmation in this app
   goes through this instead of window.confirm(). Renders directly to document.body
   so it survives independently of the main render() cycle. */
function appConfirm(message, onYes){
  const old = document.getElementById('appConfirmOverlay');
  if(old) old.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'appConfirmOverlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:420px;">
      <h3>⚠️ ${esc(state.lang==='ar'?'تأكيد الإجراء':'Confirm action')}</h3>
      <p style="font-size:13.5px; line-height:1.8;">${esc(message)}</p>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:16px;">
        <button class="btn btn-ghost" data-role="no">${esc(t('close'))}</button>
        <button class="btn btn-danger" data-role="yes">${esc(state.lang==='ar'?'تأكيد':'Confirm')}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cleanup = ()=>{ overlay.remove(); };
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(); });
  overlay.querySelector('[data-role="no"]').onclick = cleanup;
  overlay.querySelector('[data-role="yes"]').onclick = ()=>{ cleanup(); onYes(); };
}
function gradeLabel(v){ if(!v) return ''; const lv = (state.jobLevels||[]).find(x=>x.name===v); return lv ? lv.name : v; }
function familyLabel(v){ if(!v) return ''; const f = (state.jobFamilies||[]).find(x=>x.id===v || x.name===v); return f ? f.name : v; }
function seedJobArchitectureDefaults(){
  let changed = false;
  if(state.jobFamilies === null){
    state.jobFamilies = ['Operations','Support','Services'].map(name=>({id:uid(), name, archived:false}));
    changed = true;
  }
  if(state.jobLevels === null){
    const defaults = [['Director',1],['Manager',2],['Section Head',3],['Supervisor',4],['Senior',5],['Specialist',6],['Coordinator',7]];
    state.jobLevels = defaults.map(([name,rank])=>({id:uid(), name, rank, active:true, perms:{add:false,remove:false,evaluate:false,print:false}}));
    changed = true;
  }
  return changed;
}
/* Defensive fallback: job levels saved before the Grade-permissions feature
   existed won't have a `perms` field yet — this backfills it in place
   (once, on load) so every level always has one to read/write safely. */
function ensureJobLevelPerms(){
  let changed = false;
  (state.jobLevels||[]).forEach(l=>{
    if(!l.perms){ l.perms = {add:false,remove:false,evaluate:false,print:false}; changed = true; }
  });
  return changed;
}
function catLabel(v){ return v==='Operations' ? t('catOps') : v==='Support' ? t('catSupport') : v||''; }
function contractLabel(v){ return v==='Fixed' ? t('contractFixed') : v==='Indefinite' ? t('contractIndef') : v||''; }
function computeBand(score){
  if(score>=90) return {key:'excellent', label:t('band_excellent'), cls:'badge-green'};
  if(score>=70) return {key:'good', label:t('band_good'), cls:'badge-amber'};
  if(score>=50) return {key:'needs', label:t('band_needs'), cls:'badge-orange'};
  return {key:'poor', label:t('band_poor'), cls:'badge-red'};
}
function fmtNum(n){ return Math.round(n*10)/10; }
function fmtDate(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString(state.lang==='ar'?'ar-EG':'en-GB'); }catch(e){ return d; } }
function employeeById(id){ return state.employees.find(e=>e.id===id); }
function methodLabel(m){ return {kpi:t('m_kpi'), mbo:t('m_mbo'), '360':t('m_360'), bars:t('m_bars'), ranking:t('m_rank')}[m]||m; }

/* ============================== Render root ============================== */
let __lastRenderedStep = null;
function render(){
  document.documentElement.lang = state.lang;
  document.documentElement.dir = I18N[state.lang].dir;
  document.documentElement.setAttribute('data-theme', state.theme);
  const app = document.getElementById('app');
  /* The whole app now lives behind real sign-in: this is a genuinely shared
     database (see Supabase RLS policies), so — unlike the old per-browser
     localStorage version — there is nothing to show an unauthenticated
     visitor. Boot() decides when this flips (see bottom of file). */
  if(!state.session.authReady){
    app.innerHTML = renderAuthLoading();
    return;
  }
  if(!isLoggedIn()){
    app.innerHTML = renderAuthScreen();
    return;
  }
  const stepChanged = __lastRenderedStep !== state.step;
  __lastRenderedStep = state.step;
  app.innerHTML = `
    ${renderTopbar()}
    ${renderStepper()}
    <main class="${stepChanged ? 'step-anim' : ''}">${renderStep()}</main>
  `;
  if(state.step===1) initDashboardCharts();
  saveState();
}

/* Real authentication via Supabase Auth (email + password) — this replaces
   the old "pick your email, no password" client-only login entirely. The
   FIRST person ever to sign up in an empty system automatically becomes
   Admin with full permissions (see bootstrap_own_profile / profiles_insert_self
   in the database); everyone after that signs up as a plain user and an
   admin grants them real permissions from the Users & Permissions tab. */
function renderAuthScreen(){
  const mode = state.ui.authMode || 'signin';
  const err = state.ui.authError || '';
  const isFirstRun = (state.users||[]).length===0 && mode==='signup';
  return `
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div class="card" style="max-width:420px; width:100%;">

      <div style="display:flex; gap:8px; margin-bottom:14px;">
        <button class="btn btn-sm ${mode==='signin'?'btn-primary':'btn-outline'}" onclick="setAuthMode('signin')">${esc(t('login'))}</button>
        <button class="btn btn-sm ${mode==='signup'?'btn-primary':'btn-outline'}" onclick="setAuthMode('signup')">${esc(t('signUp'))}</button>
      </div>
      ${isFirstRun ? `<div class="card-warn" style="margin-bottom:10px;">${esc(t('firstAdminHint'))}</div>` : ''}
      ${err ? `<div class="card-warn" style="margin-bottom:10px;">${esc(err)}</div>` : ''}
      ${mode==='signup' ? `<div class="field"><label>${esc(t('userName'))}</label><input id="auth_name" placeholder="${esc(t('userName'))}"></div>` : ''}
      <div class="field"><label>${esc(t('userEmail'))}</label><input id="auth_email" type="email" placeholder="name@company.com"></div>
      <div class="field"><label>${esc(t('authPassword'))}</label><input id="auth_password" type="password" placeholder="••••••••"></div>
      <p class="hint">${esc(t('securityNote'))}</p>
      <div style="margin-top:10px;">
        <button class="btn btn-primary" style="width:100%;" onclick="${mode==='signup'?'doSignUp()':'doSignIn()'}">${esc(mode==='signup'?t('firstAdminBtn'):t('loginBtn'))}</button>
      </div>
    </div>
  </div>`;
}
function setAuthMode(m){ state.ui.authMode = m; state.ui.authError=''; render(); }
async function doSignIn(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  if(!email || !password){ showToast(t('requiredWarn')); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.ui.authError = error.message; render(); return; }
  await onSignedIn(data.session);
}
async function doSignUp(){
  const name = document.getElementById('auth_name').value.trim();
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  if(!name || !email || !password){ showToast(t('requiredWarn')); return; }
  const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ display_name: name } } });
  if(error){ state.ui.authError = error.message; render(); return; }
  if(!data.session){
    // Project requires email confirmation before a session exists — nothing
    // more to do here until the person confirms and comes back to sign in.
    state.ui.authMode = 'signin';
    state.ui.authError = t('confirmEmailHint');
    render();
    return;
  }
  await onSignedIn(data.session, name);
}
/* Runs after ANY successful sign-in (fresh signup with an immediate session,
   a returning signup after email confirmation, or an ordinary sign-in).
   Ensures this auth account has a profiles row — creating one (via the
   bootstrap RPC, which grants Admin automatically only if this is the very
   first account) the first time it's ever seen — then loads all shared data. */
async function onSignedIn(session, nameHint){
  state.session.userId = session.user.id;
  const { data: existing } = await sb.from('profiles').select('id').eq('id', session.user.id).maybeSingle();
  if(!existing){
    const name = nameHint || session.user.user_metadata?.display_name || session.user.email.split('@')[0];
    await sb.rpc('bootstrap_own_profile', { p_name:name, p_email:session.user.email });
  }
  await loadAllData();
  state.ui.authError='';
  render();
}
function doLogout(){ sb.auth.signOut().then(()=>{ state.session.userId=null; state.users=[]; state.employees=[]; state.departments={}; state.evaluations={}; render(); }); }

function renderStepper(){
  const steps = [1,2,3,4,5,6,7];
  const labels = {1:t('step1D'),2:t('step1'),3:t('stepDept'),4:t('step2'),5:t('step3'),6:t('step4'),7:t('stepUsers')};
  const icons = {1:'📊',2:'👥',3:'🏢',4:'🗂️',5:'✅',6:'📋',7:'🔐'};
  return `<div class="stepper no-print">
    ${steps.map(s=>`
      <div class="step-item clickable ${state.step===s?'active':''} ${state.step>s?'done':''}" onclick="goStep(${s})">
        <div class="num">${state.step>s?'✓':icons[s]}</div>
        <div>${esc(labels[s])}</div>
      </div>`).join('')}
  </div>`;
}
function goStep(s){ state.step = s; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function toggleLang(){ state.lang = state.lang==='ar'?'en':'ar'; render(); }
function toggleTheme(){ state.theme = state.theme==='dark'?'light':'dark'; render(); }

function renderStep(){
  if(state.step===1) return renderDashboardStep();
  if(state.step===2) return renderStep1();
  if(state.step===3) return renderDeptStep();
  if(state.step===4) return renderStep2();
  if(state.step===5) return renderStep3();
  if(state.step===6) return renderStep4();
  if(state.step===7) return renderUsersStep();
  return '';
}

function clearDashFilters(){ state.ui.dashDeptFilter=''; state.ui.dashMethodFilter=''; render(); }
function goToResult(empId){
  state.step = 6;
  state.ui.viewResultId = empId;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
function goToEvaluate(empId){
  state.step = 5;
  const emp = employeeById(empId);
  state.ui.evalEmployeeId = empId;
  state.ui.evalDept = emp ? emp.department : '';
  const rec = emp ? state.departments[emp.department] : null;
  const method = (rec && rec.evalMethod) || null;
  if(method){
    const existing = state.evaluations[empId];
    applyEvalMethodSelection(method, existing && existing.method===method ? existing : null);
  } else {
    state.ui.evalMethod = null;
    render();
  }

function destroyDashCharts(){
  ['deptChart','bandChart'].forEach(id=>{
    if(window.__charts && window.__charts[id]){ window.__charts[id].destroy(); delete window.__charts[id]; }
  });
}
function initDashboardCharts(){
  if(!__dashChartData || typeof Chart === 'undefined') return;
  window.__charts = window.__charts || {};
  destroyDashCharts();
  const isDark = __dashChartData.theme==='dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(18,23,63,0.07)';
  const textColor = isDark ? '#9CA3C4' : '#6B7280';
  Chart.defaults.font.family = "'Cairo', Arial, sans-serif";

  const deptEl = document.getElementById('deptChart');
  if(deptEl){
    const depts = Object.keys(__dashChartData.byDept).sort();
    window.__charts.deptChart = new Chart(deptEl, {
      type:'bar',
      data:{ labels:depts,
        datasets:[
          {label:t('dashEvaluated'), data:depts.map(d=>__dashChartData.byDept[d].evaluated), backgroundColor:'#2E7D5B', borderRadius:6, maxBarThickness:28},

        ]},
      options:{ responsive:true, maintainAspectRatio:false, animation:{duration:400},
        scales:{ x:{stacked:true, grid:{display:false}, ticks:{color:textColor}}, y:{stacked:true, beginAtZero:true, ticks:{precision:0, color:textColor}, grid:{color:gridColor}} },
        plugins:{ legend:{position:'bottom', labels:{color:textColor, boxWidth:12, padding:14}} } }
    });
  }
  const bandEl = document.getElementById('bandChart');
  if(bandEl){
    window.__charts.bandChart = new Chart(bandEl, {
      type:'doughnut',
      data:{ labels:[t('band_excellent'), t('band_good'), t('band_needs'), t('band_poor')],
        datasets:[{ data:[__dashChartData.byBand.excellent, __dashChartData.byBand.good, __dashChartData.byBand.needs, __dashChartData.byBand.poor],

      options:{ responsive:true, maintainAspectRatio:false, animation:{duration:400}, cutout:'62%',
        plugins:{ legend:{position:'bottom', labels:{color:textColor, boxWidth:12, padding:14}} } }
    });
  }
}

function renderStep1(){
  const ui = state.ui;
  return `

/* Cost center is never stored on the employee — always derived live from the
   employee's department via state.departments[dept].costCenterCode, so it can
   never drift out of sync with what's set in Departments & Org. */
function employeeCostCenter(emp){
  if(!emp || !emp.department) return null;
  const dept = state.departments[emp.department];
  if(!dept || !dept.costCenterCode) return null;
  return state.costCenters.find(c=>c.code===dept.costCenterCode) || null;
}

function onJobTitleInput(){

function onDeptInput(){

    department: val('f_dept'), managerName: val('f_mgrname'), managerTitle: val('f_mgrtitle'),
    hireDate: val('f_hire'), contractType: val('f_contract'),
  };
  const familyId = val('f_family'); const grade = val('f_grade');
  if(!rec.name || !rec.jobTitle){ showToast(t('requiredWarn')); return; }
  if(familyId){ rec.jobFamilyId = familyId; state.familyMap[rec.jobTitle] = familyId; }
  if(grade){ rec.jobGrade = grade; state.gradeMap[rec.jobTitle] = grade; }
  if(state.ui.editingEmployeeId){
    const idx = state.employees.findIndex(e=>e.id===state.ui.editingEmployeeId);

    state.employees.push(rec);

/* Departments coming from the uploaded file that have no Cost Center linked
   yet (new department, or an existing one never assigned one). Surfaced here
   so the person can link it at import time instead of a separate trip to
   Departments & Org — still writes only to state.departments[name].costCenterCode
   (the single source of truth), never onto the employee records themselves. */
function importUnlinkedDepartments(){
  const ui = state.ui;
  if(!ui.mapping.department) return [];
  const names = new Set();
  const autoLinked = new Set(); // departments the file itself supplies a Cost Center Code for — no manual pick needed
  ui.excelRows.forEach(row=>{
    const v = String(row[ui.mapping.department]||'').trim();
    if(!v) return;
    names.add(v);
    if(ui.mapping.ccCode && String(row[ui.mapping.ccCode]||'').trim()) autoLinked.add(v);
  });
  return [...names].filter(name=>{
    if(autoLinked.has(name)) return false;
    const rec = state.departments[name];
    return !rec || !rec.costCenterCode;
  }).sort((a,b)=>a.localeCompare(b));
}
function renderImportDeptCCAssign(){
  const unlinked = importUnlinkedDepartments();

/* Best-effort auto-mapping: guess which uploaded column matches each employee
   field by keyword, so the person usually only has to press Import instead of
   mapping all 9 fields by hand. Anything unmatched is simply left "— None —"
   for manual mapping. */
const EXCEL_FIELD_KEYWORDS = {
  code:['code','كود'],
  name:['name','اسم'],
  jobTitle:['job title','jobtitle','title','مسمى','وظيف'],
  jobCategory:['category','فئة','category'],
  department:['department','dept','قسم'],
  ccCode:['cost center code','cost centre code','cost center','cost centre','كود مركز التكلفة','كود المركز','مركز التكلفة'],
  ccName:['cost center name','cost centre name','اسم مركز التكلفة','اسم المركز'],
  jobFamily:['job family','jobfamily','family','العائلة الوظيفية','العائلة'],
  jobGrade:['job grade','grade','level','job level','الدرجة الوظيفية','الدرجة','المستوى الوظيفي'],
  managerName:['manager name','direct manager','manager','مدير مباشر','مدير'],
  managerTitle:['manager title','مسمى المدير','مسمى مدير'],
  hireDate:['hire date','hiredate','date','تعيين','تاريخ'],
  contractType:['contract','عقد'],
};
function autoMapExcelHeaders(headers){
  const mapping = {};
  const used = new Set();
  const order = ['code','name','jobTitle','jobCategory','department','ccName','ccCode','jobFamily','jobGrade','managerTitle','managerName','hireDate','contractType'];
  order.forEach(key=>{
    const keywords = EXCEL_FIELD_KEYWORDS[key];
    const match = headers.find(h=>{
      if(used.has(h)) return false;
      const s = String(h).toLowerCase();
      return keywords.some(k=>s.includes(k));
    });
    if(match){ mapping[key] = match; used.add(match); }
  });
  return mapping;
}
function handleExcelFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    showToast(state.lang==='ar' ? 'تعذّر تحميل مكتبة قراءة الإكسل — تأكد من اتصالك بالإنترنت وأعد المحاولة' : 'The Excel library failed to load — check your internet connection and try again');
    return;
  }
  state.ui.excelFileName = file.name;
  render();
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ showToast(t('dataMissing')); return; }
      const headers = Object.keys(rows[0]);
      state.ui.excelHeaders = headers;
      state.ui.excelRows = rows;
      state.ui.mapping = autoMapExcelHeaders(headers);
      render();
      showToast(state.lang==='ar' ? '✓ تم قراءة الملف — راجع الربط ثم اضغط "استيراد البيانات"' : '✓ File read — review the mapping, then click "Import Data"');
    }catch(err){
      showToast((state.lang==='ar' ? 'تعذّرت قراءة الملف: ' : 'Could not read the file: ') + (err && err.message ? err.message : err));
    }
  };
  reader.onerror = function(){
    showToast(state.lang==='ar' ? 'تعذّرت قراءة الملف من المتصفح' : 'The browser could not read this file');
  };
  reader.readAsArrayBuffer(file);
}
function setMapping(key, val){ state.ui.mapping[key] = val; render(); }
function findOrCreateFamilyByName(name){
  const s = (name||'').trim();
  if(!s) return '';
  let f = (state.jobFamilies||[]).find(x=>x.name.toLowerCase()===s.toLowerCase());
  if(!f){ f = {id:uid(), name:s, archived:false}; state.jobFamilies.push(f); }
  return f.id;
}
function findOrCreateGradeByName(name){
  const s = (name||'').trim();
  if(!s) return '';
  let l = (state.jobLevels||[]).find(x=>x.name.toLowerCase()===s.toLowerCase());
  if(!l){
    const maxRank = state.jobLevels.length ? Math.max(...state.jobLevels.map(x=>x.rank)) : 0;
    l = {id:uid(), name:s, rank:maxRank+1, active:true};
    state.jobLevels.push(l);
  }
  return l.name;
}
function importExcelData(){
  const m = state.ui.mapping;
  let count = 0;
  state.ui.excelRows.forEach(row=>{
    const rec = {
      id: uid(),
      code: m.code ? String(row[m.code]||'') : '',
      name: m.name ? String(row[m.name]||'') : '',
      jobTitle: m.jobTitle ? String(row[m.jobTitle]||'') : '',
      jobCategory: m.jobCategory ? normalizeCategory(String(row[m.jobCategory]||'')) : 'Operations',
      department: m.department ? String(row[m.department]||'') : '',
      managerName: m.managerName ? String(row[m.managerName]||'') : '',
      managerTitle: m.managerTitle ? String(row[m.managerTitle]||'') : '',
      hireDate: m.hireDate ? String(row[m.hireDate]||'') : '',
      contractType: m.contractType ? normalizeContract(String(row[m.contractType]||'')) : 'Indefinite',
    };
    // If the file carries Job Family / Job Grade columns, resolve them to the
    // canonical family/level and cascade to every employee sharing this Job
    // Title — same state.familyMap/state.gradeMap the Job Portfolio tab
    // already uses, so nothing is stored separately from that single source.
    if(rec.jobTitle){
      const famName = m.jobFamily ? String(row[m.jobFamily]||'').trim() : '';
      const gradeName = m.jobGrade ? String(row[m.jobGrade]||'').trim() : '';
      if(famName){ rec.jobFamilyId = findOrCreateFamilyByName(famName); state.familyMap[rec.jobTitle] = rec.jobFamilyId; }
      if(gradeName){ rec.jobGrade = findOrCreateGradeByName(gradeName); state.gradeMap[rec.jobTitle] = rec.jobGrade; }
    }
    if(rec.name){ state.employees.push(rec); count++; }
  });
  // If the file itself carries Cost Center Code/Name columns, use them to
  // create/find the Cost Center and link it to the department — straight
  // into state.costCenters / state.departments (the single source of truth),
  // never stored again on the employee records.
  if(m.ccCode){
    const ccByDept = {};
    state.ui.excelRows.forEach(row=>{
      const dept = m.department ? String(row[m.department]||'').trim() : '';
      const code = String(row[m.ccCode]||'').trim();
      const name = m.ccName ? String(row[m.ccName]||'').trim() : '';
      if(dept && code) ccByDept[dept] = {code, name: name || (ccByDept[dept]&&ccByDept[dept].name) || ''};
    });
    Object.keys(ccByDept).forEach(dept=>{
      const {code, name} = ccByDept[dept];
      let cc = state.costCenters.find(c=>c.code===code);
      if(!cc){
        cc = {id:uid(), code, name: name||code, departmentName:dept, managerName:'', status:'active'};
        state.costCenters.push(cc);
      } else if(name && !cc.name){
        cc.name = name;
      }
      state.departments[dept] = state.departments[dept] || {manager:'',sectionHead:'',supervisor:'',businessUnit:'',costCenterCode:'',status:'active'};
      state.departments[dept].costCenterCode = code;
    });
  }
  // Apply any Cost Center links chosen manually for departments the file
  // didn't already cover — same single source of truth, no duplication.
  Object.keys(state.ui.importDeptCC).forEach(deptName=>{
    const code = state.ui.importDeptCC[deptName];
    if(!code) return;
    state.departments[deptName] = state.departments[deptName] || {manager:'',sectionHead:'',supervisor:'',businessUnit:'',costCenterCode:'',status:'active'};
    state.departments[deptName].costCenterCode = code;
  });
  state.ui.excelHeaders = []; state.ui.excelRows = []; state.ui.mapping = {}; state.ui.excelFileName = ''; state.ui.importDeptCC = {};
  render();
  showToast((state.lang==='ar'?'تم استيراد ':'Imported ')+count+(state.lang==='ar'?' موظف':' employees'));
}
function normalizeCategory(v){
  const s = v.trim().toLowerCase();
  if(s.includes('عمليات') || s.includes('operation')) return 'Operations';
  if(s.includes('دعم') || s.includes('support')) return 'Support';
  return 'Operations';
}
function normalizeContract(v){
  const s = v.trim().toLowerCase();
  if(s.includes('محدد') || s.includes('fixed')) return 'Fixed';
  return 'Indefinite';
}
function downloadEmployeeTemplate(){

/* Best-effort autofill: infer a department's Manager / Section Head / Supervisor
   from the "Direct Manager" + "Direct Manager Title" already captured on each
   employee in the Employee Database, instead of requiring separate re-entry. */
function guessDeptRoles(deptName){
  const counts = {};
  state.employees.forEach(e=>{
    if((e.department||'—')!==deptName || !e.managerName) return;
    const key = e.managerName;
    if(!counts[key]) counts[key] = {title:e.managerTitle||'', count:0};
    counts[key].count++;
  });
  const candidates = Object.entries(counts).map(([name,info])=>({name, title:info.title, count:info.count}))
    .sort((a,b)=>b.count-a.count);
  const classify = (title)=>{
    const s = (title||'').toLowerCase();
    if(title.includes('رئيس قسم') || title.includes('قسم') || s.includes('section')) return 'sectionHead';
    if(title.includes('مشرف') || s.includes('supervisor')) return 'supervisor';
    if(title.includes('مدير') || s.includes('manager') || s.includes('head')) return 'manager';
    return null;
  };
  const result = {manager:'', sectionHead:'', supervisor:''};
  candidates.forEach(c=>{
    const role = classify(c.title);
    if(role && !result[role]) result[role] = c.name;
  });
  if(!result.manager && !result.sectionHead && !result.supervisor && candidates.length){
    result.manager = candidates[0].name;
  }
  return result;
}
function autoDetectDeptRoles(deptName){
  const guess = guessDeptRoles(deptName);
  const mgrEl = document.getElementById('dept_mgr');
  const shEl = document.getElementById('dept_sh');
  const supEl = document.getElementById('dept_sup');
  let filled = 0;
  if(mgrEl && !mgrEl.value.trim() && guess.manager){ mgrEl.value = guess.manager; filled++; }
  if(shEl && !shEl.value.trim() && guess.sectionHead){ shEl.value = guess.sectionHead; filled++; }
  if(supEl && !supEl.value.trim() && guess.supervisor){ supEl.value = guess.supervisor; filled++; }
  if(filled===0){
    showToast(state.lang==='ar' ? 'لا توجد بيانات كافية في قاعدة بيانات الموظفين لاقتراح هذه الحقول' : 'Not enough data in the Employee Database to suggest these fields');
  } else {
    showToast(state.lang==='ar' ? 'تم الاقتراح من قاعدة بيانات الموظفين — راجع القيم ثم اضغط حفظ' : 'Suggested from the Employee Database — review, then click Save');
  }
}

}

function moveLevel(id, dir){
  const sorted = state.jobLevels.slice().sort((a,b)=>a.rank-b.rank);
  const idx = sorted.findIndex(l=>l.id===id);
  const swapIdx = idx + dir;
  if(swapIdx<0 || swapIdx>=sorted.length) return;
  const tmp = sorted[idx].rank;
  sorted[idx].rank = sorted[swapIdx].rank;
  sorted[swapIdx].rank = tmp;
  render();
}
function levelInUse(name){ return state.employees.some(e=>e.jobGrade===name) || Object.values(state.gradeMap).includes(name); }

function buildOrgTree(emps){
  const byName = {};
  emps.forEach(e=>{ if(e.name) byName[e.name] = e; });
  const childrenMap = {};
  const roots = [];
  emps.forEach(e=>{
    const mgrName = e.managerName;
    const isRoot = !mgrName || !byName[mgrName] || mgrName === e.name;
    if(isRoot){
      roots.push(e);
    } else {
      if(!childrenMap[mgrName]) childrenMap[mgrName] = [];
      childrenMap[mgrName].push(e);
    }
  });
  return {byName, childrenMap, roots};
}
function renderOrgChart(){
  const emps = visibleEmployees();
  if(emps.length===0) return `<div class="empty-state"><div class="ei">🗂️</div><div>${esc(t('noEmployees'))}</div></div>`;
  const {childrenMap, roots} = buildOrgTree(emps);
  const search = (state.ui.orgSearch||'').trim().toLowerCase();
  return `
  <div class="toolbar" style="margin-bottom:14px;">
    <div class="left">
      <input id="orgSearchInput" placeholder="${esc(t('search'))}" value="${esc(state.ui.orgSearch||'')}" oninput="setOrgSearch(this.value)"
        style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:220px;">

      <button class="btn btn-ghost btn-sm" onclick="collapseAllOrg()">${esc(t('collapseAll'))}</button>
    </div>
  </div>
  <div class="org-tree">
    ${roots.sort((a,b)=>(a.name||'').localeCompare(b.name||'')).map(r=>renderOrgNode(r, childrenMap, 0, search)).join('')}
  </div>
  ${state.ui.profileModalId ? renderEmployeeProfileModal(state.ui.profileModalId) : ''}
  `;
}
function nodeSubtreeMatches(emp, childrenMap, search){
  if(!search) return true;
  const hay = ((emp.name||'')+' '+(emp.jobTitle||'')+' '+(emp.department||'')).toLowerCase();
  if(hay.includes(search)) return true;
  const kids = childrenMap[emp.name]||[];
  return kids.some(k=>nodeSubtreeMatches(k, childrenMap, search));
}
function isOrgNodeExpanded(emp, depth){
  const v = state.ui.orgExpanded[emp.id];
  if(v === true) return true;
  if(v === false) return false;
  return depth === 0;  // default: root nodes start expanded, deeper nodes start collapsed
}
function renderOrgNode(emp, childrenMap, depth, search){
  const kids = (childrenMap[emp.name]||[]).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(search && !nodeSubtreeMatches(emp, childrenMap, search)) return '';
  const hasKids = kids.length>0;
  const expanded = search ? true : isOrgNodeExpanded(emp, depth);
  const isMatch = search && ((emp.name||'')+' '+(emp.jobTitle||'')).toLowerCase().includes(search);
  const ccName = (employeeCostCenter(emp)||{}).name || '';
  return `
  <div class="org-node" style="margin-${state.lang==='ar'?'right':'left'}:${depth*22}px;">
    <div class="org-node-row ${isMatch?'org-node-match':''} ${depth===0?'org-node-root':''}" onclick="openEmployeeProfile('${emp.id}')">
      ${hasKids ? `<button class="org-toggle" onclick="event.stopPropagation(); toggleOrgNode('${emp.id}', ${expanded})">${expanded?'▾':(state.lang==='ar'?'◂':'▸')}</button>` : `<span class="org-toggle-spacer"></span>`}
      <div class="org-avatar">${esc((emp.name||'?').trim()[0]||'?')}</div>
      <div class="org-node-info">
        <div class="org-node-name">${esc(emp.name)} ${hasKids?`<span class="hint">(${kids.length})</span>`:''}</div>
        <div class="org-node-meta">${esc(emp.jobTitle||'')}${emp.jobGrade?' · '+esc(emp.jobGrade):''} · ${esc(emp.department||'')}${ccName?' · '+esc(ccName):''}</div>
      </div>
    </div>
    ${hasKids && expanded ? `<div class="org-children">${kids.map(k=>renderOrgNode(k, childrenMap, depth+1, search)).join('')}</div>` : ''}
  </div>`;
}

function resetMethodRows(m){
  if(m==='kpi') state.ui.kpiRows = [blankKpiRow()];
  if(m==='mbo') state.ui.mboRows = [blankMboRow()];
  if(m==='360'){ state.ui.comp360 = defaultCompetencies().map(c=>({name:c, self:'',mgr:'',peer:'',sub:''})); state.ui.raterWeights = {mgr:40,peer:30,self:15,sub:15}; state.ui.raters360 = {mgr:'',peer:'',sub:'',followUps:[]}; }
  if(m==='bars') state.ui.compBars = defaultBarsCompetencies().map(c=>({name:c, level:'', weight:''}));
  if(m==='ranking'){ state.ui.rankGroupKey=''; state.ui.rankRows=[]; }

  const emp = employeeById(state.ui.evalEmployeeId);
  if(!emp) return;
  appConfirm(t('confirmMethodChange'), ()=>{

function setEvalEmployee(id){
  state.ui.evalEmployeeId = id || null;
  const method = state.ui.evalMethod;
  if(method){
    const emp = employeeById(id);
    const existing = emp ? state.evaluations[emp.id] : null;
    applyEvalMethodSelection(method, existing && existing.method===method ? existing : null);
    return;
  }
  render();
}
function setDeptEvalMethod(dept, method){
  const impacted = state.employees.filter(e=>e.department===dept && state.evaluations[e.id] && state.evaluations[e.id].method!==method);
  const apply = ()=>{
    state.departments[dept] = state.departments[dept] || {manager:'',sectionHead:'',supervisor:'',businessUnit:'',costCenterCode:'',status:'active'};
    state.departments[dept].evalMethod = method;
    impacted.forEach(e=>{ delete state.evaluations[e.id]; sb.from('evaluations').delete().eq('employee_id', e.id).then(()=>{}); });
    state.ui.evalMethod = method;
    resetMethodRows(method);
    render();
    showToast('✓');
  };
  if(impacted.length>0) appConfirm(t('confirmDeptMethodChange'), apply);
  else apply();
}
function changeDeptEvalMethod(dept){
  appConfirm(t('confirmDeptMethodChange'), ()=>{
    if(state.departments[dept]) state.departments[dept].evalMethod = '';
    state.employees.forEach(e=>{ if(e.department===dept) delete state.evaluations[e.id]; });
    state.ui.evalMethod = null;
    state.ui.evalEmployeeId = null;
    render();
    showToast(t('deptMethodReset'));
  });
}
function applyEvalMethodSelection(m, existing){
  state.ui.evalMethod = m;
  if(existing && existing.method===m){
    if(m==='kpi') state.ui.kpiRows = JSON.parse(JSON.stringify(existing.data.rows||[]));
    if(m==='mbo') state.ui.mboRows = JSON.parse(JSON.stringify(existing.data.rows||[]));
    if(m==='360'){ state.ui.comp360 = JSON.parse(JSON.stringify(existing.data.comps||[])); state.ui.raterWeights = Object.assign({}, existing.data.weights||state.ui.raterWeights); state.ui.raters360 = JSON.parse(JSON.stringify(existing.data.raters||{mgr:'',peer:'',sub:'',followUps:[]})); }
    if(m==='bars') state.ui.compBars = JSON.parse(JSON.stringify(existing.data.comps||[]));
    if(m==='ranking'){ state.ui.rankGroupKey = existing.data.groupKey||''; state.ui.rankRows = JSON.parse(JSON.stringify(existing.data.rows||[])); }
  } else {
    resetMethodRows(m);
  }
  render();
}

}
function findHeader(headers, keywords){
  return headers.find(h => keywords.some(k => String(h).toLowerCase().includes(k)));
}
function handleTemplateFile(method, event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
      if(rows.length===0){ showToast(t('dataMissing')); return; }
      const headers = Object.keys(rows[0]);
      const gradeH = findHeader(headers, ['درجة','grade']);
      const weightH = findHeader(headers, ['وزن','weight']);
      let nameH, targetH, dirH;
      if(method==='kpi'){
        nameH = findHeader(headers, ['مؤشر','kpi','indicator','name']);
        targetH = findHeader(headers, ['مستهدف','target']);
        dirH = findHeader(headers, ['اتجاه','direction']);
      } else if(method==='mbo'){
        nameH = findHeader(headers, ['هدف','goal']);
      } else {
        nameH = findHeader(headers, ['كفاءة','competency']);
      }
      if(!gradeH || !nameH){ showToast(t('requiredWarn')); return; }
      const newRows = rows.map(r=>{
        const grade = normalizeGradeText(r[gradeH]);
        const base = {id:uid(), grade};
        if(method==='kpi'){
          base.name = String(r[nameH]||'').trim();
          base.weight = weightH ? parseFloat(r[weightH])||'' : '';
          base.target = targetH ? (r[targetH]!==''? parseFloat(r[targetH]) : '') : '';
          const dirRaw = dirH ? String(r[dirH]||'').toLowerCase() : '';
          base.direction = (dirRaw.includes('أقل')||dirRaw.includes('lower')) ? 'lower' : 'higher';
        } else if(method==='mbo'){
          base.goal = String(r[nameH]||'').trim();
          base.weight = weightH ? parseFloat(r[weightH])||'' : '';
        } else {
          base.competency = String(r[nameH]||'').trim();
          base.weight = weightH ? (r[weightH]!==''? parseFloat(r[weightH]) : '') : '';
        }
        return base;
      }).filter(r => r.grade && (r.name||r.goal||r.competency));
      if(newRows.length===0){ showToast(t('dataMissing')); return; }
      const gradesInFile = new Set(newRows.map(r=>r.grade));
      state.templates[method] = state.templates[method].filter(r=>!gradesInFile.has(r.grade)).concat(newRows);
      render();
      showToast(t('tplUploaded'));
    }catch(err){ showToast('Error reading file'); }
  };
  reader.readAsArrayBuffer(file);
}
function templateRowsForEmployee(method){
  const emp = employeeById(state.ui.evalEmployeeId);
  if(!emp || !emp.jobGrade) return [];
  return state.templates[method].filter(r=>r.grade===emp.jobGrade);
}
function loadTemplateIntoForm(method){
  const rows = templateRowsForEmployee(method);
  if(rows.length===0){ showToast(t('tplNoMatch')); return; }
  appConfirm(t('tplLoadConfirm'), ()=>{
    if(method==='kpi'){
      state.ui.kpiRows = rows.map(r=>({id:uid(), name:r.name, target:r.target, actual:'', weight:r.weight, dir:r.direction||'higher'}));
    } else if(method==='mbo'){
      state.ui.mboRows = rows.map(r=>({id:uid(), goal:r.goal, weight:r.weight, achv:''}));
    } else if(method==='bars'){
      state.ui.compBars = rows.map(r=>({name:r.competency, level:'', weight:r.weight}));
    } else if(method==='360'){
      state.ui.comp360 = rows.map(r=>({name:r.competency, self:'',mgr:'',peer:'',sub:''}));

    render();

}

function calcKpi(){
  const rows = state.ui.kpiRows.filter(r=>r.name && r.target!=='' && r.actual!=='' && r.weight!=='');
  if(rows.length===0){ showToast(t('addKpiFirst')); return; }
  let totalWeight = 0, weighted = 0;
  const detail = rows.map(r=>{
    const target = parseFloat(r.target), actual = parseFloat(r.actual), weight = parseFloat(r.weight);
    let achv = r.dir==='lower' ? (target/actual)*100 : (actual/target)*100;
    if(!isFinite(achv)) achv = 0;
    achv = Math.min(achv, 120);
    totalWeight += weight; weighted += achv*weight/100;
    return {name:r.name, target, actual, dir:r.dir, weight, achv:fmtNum(achv)};
  });
  const score = totalWeight>0 ? fmtNum(weighted*100/totalWeight) : 0;
  saveEvalResult('kpi', {rows:state.ui.kpiRows, detail}, score);
}

/* Who rates + who follows up a 360 evaluation is decided PER EMPLOYEE, at

            <input type="checkbox" ${(r.followUps||[]).includes(u.id)?'checked':''} onchange="toggleRater360Followup('${u.id}',this.checked)">
            ${esc(u.name)}
          </label>`).join('')}
      </div>

  `;

function updRater360(role, userId){ state.ui.raters360[role] = userId; }
function toggleRater360Followup(userId, checked){
  const set = new Set(state.ui.raters360.followUps || []);
  if(checked) set.add(userId); else set.delete(userId);
  state.ui.raters360.followUps = [...set];
}
function raterUserName(userId){ if(!userId) return ''; const u=(state.users||[]).find(x=>x.id===userId); return u ? u.name : ''; }
function calc360(){
  const comps = state.ui.comp360.filter(c=>c.name);
  if(comps.length===0){ showToast(t('addCompFirst')); return; }
  const w = state.ui.raterWeights;
  const wMgr=parseFloat(w.mgr)||0, wPeer=parseFloat(w.peer)||0, wSelf=parseFloat(w.self)||0, wSub=parseFloat(w.sub)||0;
  const wTotal = wMgr+wPeer+wSelf+wSub || 100;
  let sumScore=0, sumSelf=0, sumOthers=0, n=0;
  const detail = comps.map(c=>{
    const self=parseFloat(c.self)||0, mgr=parseFloat(c.mgr)||0, peer=parseFloat(c.peer)||0, sub=parseFloat(c.sub)||0;
    const weighted = (mgr*wMgr + peer*wPeer + self*wSelf + sub*wSub)/wTotal;
    const others = (mgr*wMgr + peer*wPeer + sub*wSub)/(wMgr+wPeer+wSub || 1);
    sumScore += weighted; sumSelf += self; sumOthers += others; n++;
    return {name:c.name, self, mgr, peer, sub, weighted:fmtNum(weighted)};
  });
  const avg5 = n>0 ? sumScore/n : 0;
  const score = fmtNum(avg5/5*100);
  const gap = fmtNum((sumSelf/n) - (sumOthers/n));
  saveEvalResult('360', {comps:state.ui.comp360, weights:w, detail, gap, raters: JSON.parse(JSON.stringify(state.ui.raters360||{mgr:'',peer:'',sub:'',followUps:[]}))}, score);
}

function calcBars(){
  const comps = state.ui.compBars.filter(c=>c.name && c.level!=='');
  if(comps.length===0){ showToast(t('addCompFirst')); return; }
  const hasWeights = comps.every(c=>c.weight!=='' && c.weight!==undefined);
  let score;
  const detail = comps.map(c=>({name:c.name, level:parseFloat(c.level), weight:c.weight===''?null:parseFloat(c.weight)}));
  if(hasWeights){
    const totalW = detail.reduce((s,d)=>s+d.weight,0) || 1;
    score = fmtNum(detail.reduce((s,d)=>s+ (d.level/5*100)*d.weight,0)/totalW);
  } else {
    const avg = detail.reduce((s,d)=>s+d.level,0)/detail.length;
    score = fmtNum(avg/5*100);
  }
  saveEvalResult('bars', {comps:state.ui.compBars, detail}, score);
}

function renderRankingForm(){
  const emp = employeeById(state.ui.evalEmployeeId);
  const groups = {};
  state.employees.forEach(e=>{
    const key = e.department || e.jobTitle || '—';
    if(!groups[key]) groups[key]=[];
    groups[key].push(e);
  });
  const groupKeys = Object.keys(groups);
  const currentKey = state.ui.rankGroupKey || (emp ? (emp.department||emp.jobTitle||'') : '');
  if(state.ui.rankRows.length===0 && groups[currentKey]){
    state.ui.rankRows = groups[currentKey].map(e=>({empId:e.id, name:e.name, value:''}));
  }
  return `
  <div class="card">
    <h3>${esc(t('m_rank'))}</h3>
    <div class="field" style="max-width:360px;">
      <label>${esc(t('rankGroup'))}</label>
      <select onchange="setRankGroup(this.value)">
        ${groupKeys.map(k=>`<option value="${esc(k)}" ${currentKey===k?'selected':''}>${esc(k)} (${groups[k].length})</option>`).join('')}
      </select>
    </div>
    ${state.ui.rankRows.length < 2 ? `<div class="empty-state"><div class="ei">👥</div><div>${esc(t('addPeersFirst'))}</div></div>` : `
    <div class="table-wrap" style="margin-top:12px;"><table>
      <thead><tr><th>${esc(t('fName'))}</th><th>${esc(t('rankScore'))}</th></tr></thead>
      <tbody>
        ${state.ui.rankRows.map((r,i)=>`
          <tr ${r.empId===state.ui.evalEmployeeId?'style="background:var(--amber-bg);"':''}>
            <td>${esc(r.name)} ${r.empId===state.ui.evalEmployeeId?'⭐':''}</td>
            <td><input type="number" value="${esc(r.value)}" oninput="updRank(${i},this.value)" style="width:100px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);"></td>
          </tr>`).join('')}
      </tbody>
    </table></div>
    <div style="margin-top:14px;"><button class="btn btn-primary" onclick="calcRanking()">${esc(t('calcBtn'))}</button></div>
    `}
  </div>
  ${renderResultBox()}`;
}
function setRankGroup(key){
  state.ui.rankGroupKey = key;
  const emps = state.employees.filter(e => (e.department||e.jobTitle||'')===key);
  state.ui.rankRows = emps.map(e=>({empId:e.id, name:e.name, value:''}));
  render();
}
function updRank(i,val){ state.ui.rankRows[i].value = val; }
function calcRanking(){
  const rows = state.ui.rankRows.filter(r=>r.value!=='');
  if(rows.length<2){ showToast(t('addPeersFirst')); return; }
  const sorted = rows.slice().sort((a,b)=>parseFloat(b.value)-parseFloat(a.value));
  const n = sorted.length;
  const withRank = sorted.map((r,i)=>{
    const pct = (i+1)/n;
    let bucket, score;
    if(pct<=0.2){ bucket='topGroup'; score=95; }
    else if(pct<=0.9){ bucket='midGroup'; score=75; }
    else { bucket='lowGroup'; score=50; }
    return Object.assign({}, r, {rank:i+1, bucket, score});
  });
  const me = withRank.find(r=>r.empId===state.ui.evalEmployeeId);
  if(!me){ showToast(t('dataMissing')); return; }
  saveEvalResult('ranking', {groupKey:state.ui.rankGroupKey, rows:state.ui.rankRows, detail:withRank, myRank:me.rank, myBucket:me.bucket, total:n}, me.score);
}

/* ---- Export helpers ---- */
function deptRecord(deptName){ return state.departments[deptName] || {manager:'',sectionHead:'',supervisor:''}; }
function methodLabelEN(m){ return {kpi:'KPI', mbo:'MBO', '360':'360 Feedback', bars:'BARS', ranking:'Ranking'}[m]||m; }
function methodDetailTable(emp, ev, lang){
  const L = lang==='en' ? I18N.en : I18N[state.lang];
  const tt = k => L[k] || k;
  const m = ev.method;
  const detail = (ev.data && ev.data.detail) || [];
  if(m==='kpi'){
    return { headers:[tt('kpiName'), tt('target'), tt('actual'), tt('direction'), tt('weight'), tt('achievement')],
      rows: detail.map(d=>[d.name, d.target, d.actual, d.dir==='lower'?tt('dirLower'):tt('dirHigher'), (d.weight||0)+'%', fmtNum(d.achv)+'%']) };
  }
  if(m==='mbo'){
    return { headers:[tt('goalDesc'), tt('goalWeight'), tt('goalAchv')],
      rows: detail.map(d=>[d.goal, (d.weight||0)+'%', (d.achv||0)+'%']) };
  }
  if(m==='360'){
    return { headers:[tt('competency'), tt('selfScore'), tt('mgrScore'), tt('peerScore'), tt('subScore'), tt('finalScore')],
      rows: detail.map(d=>[d.name, d.self, d.mgr, d.peer, d.sub||'—', fmtNum(d.weighted)]) };
  }
  if(m==='bars'){
    return { headers:[tt('competency'), tt('level'), tt('weight')],
      rows: detail.map(d=>[d.name, d.level, d.weight===null||d.weight===undefined?'—':d.weight+'%']) };
  }
  if(m==='ranking'){
    const bucketLabel = b => b==='topGroup'?tt('topGroup') : b==='midGroup'?tt('midGroup') : tt('lowGroup');
    return { headers:[tt('rank'), tt('fName'), tt('rankScore'), tt('percentile')],
      rows: detail.map(d=>[d.rank, d.name + (d.empId===emp.id?' ⭐':''), d.value, bucketLabel(d.bucket)]) };
  }
  return {headers:[], rows:[]};
}

async function triggerDownload(blob, filename){
  let downloads = null;
  try{
    downloads = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
  }catch(e){ downloads = null; }
  if(downloads){
    try{
      await downloads.save({filename, data: blob});   // pass the Blob directly — do NOT base64-encode it
      return;
    }catch(err){
      if(err && err.code === 'declined') return;       // viewer said no — respect that, don't silently redownload
      // any other error (unavailable/bad_request/etc.) falls through to the direct-anchor fallback below
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
}

async function generatePdf(list, filename){
  if(list.length===0){ showToast(t('resultsEmpty')); return; }
  showToast(t('generatingPdf'));
  const container = document.createElement('div');
  container.style.position='fixed'; container.style.left='-9999px'; container.style.top='0'; container.style.background='#fff';
  document.body.appendChild(container);
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({unit:'pt', format:'a4'});
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    for(let i=0;i<list.length;i++){
      container.innerHTML = buildDetailedReportHTML(list[i].emp, list[i].ev);
      await new Promise(r=>setTimeout(r, 60));
      const canvas = await html2canvas(container, {scale:2, backgroundColor:'#ffffff'});
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      const imgW = pageW - 40;
      let imgH = canvas.height * imgW / canvas.width;
      if(imgH > pageH - 40){ const scale = (pageH-40)/imgH; imgH = pageH-40; }
      if(i>0) doc.addPage();
      doc.addImage(imgData, 'JPEG', 20, 20, imgW, imgH);
    }
    const blob = doc.output('blob');
    await triggerDownload(blob, filename);
  } finally {
    document.body.removeChild(container);
  }
}
function exportSinglePdf(empId){
  const emp = employeeById(empId); const ev = state.evaluations[empId];
  if(!emp||!ev) return;
  generatePdf([{emp,ev}], 'evaluation_'+(emp.code||emp.name||'report')+'.pdf');
}

            <td>${us.role==='admin'||us.perms.add||gradePermGrant(us,'add')?'✅':'—'}</td><td>${us.role==='admin'||us.perms.remove||gradePermGrant(us,'remove')?'✅':'—'}</td>
            <td>${us.role==='admin'||us.perms.evaluate||gradePermGrant(us,'evaluate')?'✅':'—'}</td><td>${us.role==='admin'||us.perms.print||gradePermGrant(us,'print')?'✅':'—'}</td>
            <td class="row-actions">
              <button class="btn btn-sm btn-outline" onclick="editUser('${us.id}')">${esc(t('edit'))}</button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser('${us.id}')">${esc(t('delete'))}</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table></div>`}
  </div>
  <div class="card">
    <h3>${esc(t('gradePermsTitle'))}</h3>
    <p class="hint">${esc(t('gradePermsSub'))}</p>
    ${renderGradePermsTable()}
  </div>`}
  `;
}
/* Grade-based permission templates: an ADDITIVE layer on top of each user's
   own checkboxes (see gradePermGrant/hasPerm) — a user gets an action if
   either their own perms OR their assigned Job Grade's default perms grant
   it. The permission set lives once on the job level record itself
   (state.jobLevels[i].perms), never copied onto individual users. */
function renderGradePermsTable(){
  const levels = (state.jobLevels||[]).filter(l=>l.active);
  if(levels.length===0) return `<div class="empty-state"><div class="ei">🎚️</div><div>${esc(t('noGradesYet'))}</div></div>`;
  return `
  <div class="table-wrap"><table>
    <thead><tr><th>${esc(t('gradeCol'))}</th><th>${esc(t('permAdd'))}</th><th>${esc(t('permRemove'))}</th><th>${esc(t('permEvaluate'))}</th><th>${esc(t('permPrint'))}</th></tr></thead>
    <tbody>
      ${levels.map(l=>{
        const p = l.perms || {add:false,remove:false,evaluate:false,print:false};
        return `<tr>
          <td><b>${esc(l.name)}</b></td>
          <td><input type="checkbox" ${p.add?'checked':''} onchange="setGradePerm('${l.id}','add',this.checked)"></td>
          <td><input type="checkbox" ${p.remove?'checked':''} onchange="setGradePerm('${l.id}','remove',this.checked)"></td>
          <td><input type="checkbox" ${p.evaluate?'checked':''} onchange="setGradePerm('${l.id}','evaluate',this.checked)"></td>
          <td><input type="checkbox" ${p.print?'checked':''} onchange="setGradePerm('${l.id}','print',this.checked)"></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table></div>`;
}
function setGradePerm(levelId, key, checked){
  const lvl = (state.jobLevels||[]).find(l=>l.id===levelId);
  if(!lvl) return;
  if(!lvl.perms) lvl.perms = {add:false,remove:false,evaluate:false,print:false};
  lvl.perms[key] = !!checked;
  render();
  showToast(t('gradeSaved'));
}
function renderUserForm(depts){
  const editing = state.ui.editingUserId ? state.users.find(u=>u.id===state.ui.editingUserId) : null;
  if(!editing) return '';
  const v = editing;
  const activeLevels = (state.jobLevels||[]).filter(l=>l.active);
  return `
    <div class="form-grid">
      <div class="field"><label>${esc(t('userName'))}</label><input value="${esc(v.name)}" disabled></div>
      <div class="field"><label>${esc(t('userEmail'))}</label><input value="${esc(v.email)}" disabled></div>
      <div class="field"><label>${esc(t('userRole'))}</label>
        <select id="u_role">
          <option value="admin" ${v.role==='admin'?'selected':''}>${esc(t('roleAdmin'))}</option>
          <option value="manager" ${v.role==='manager'?'selected':''}>${esc(t('roleManager'))}</option>
          <option value="sectionhead" ${v.role==='sectionhead'?'selected':''}>${esc(t('roleSectionhead'))}</option>
          <option value="supervisor" ${v.role==='supervisor'?'selected':''}>${esc(t('roleSupervisor'))}</option>
        </select>
      </div>
      <div class="field"><label>${esc(t('userDept'))}</label>
        <select id="u_dept">
          <option value="">—</option>
          ${depts.map(d=>`<option value="${esc(d)}" ${v.department===d?'selected':''}>${esc(d)}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>${esc(t('userGrade'))}</label>
        <select id="u_grade">
          <option value="">—</option>
          ${activeLevels.map(l=>`<option value="${esc(l.name)}" ${v.grade===l.name?'selected':''}>${esc(l.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="form-grid" style="margin-top:10px;">
      <label class="field" style="display:flex; align-items:center; gap:6px; flex-direction:row;"><input type="checkbox" id="u_perm_add" ${v.perms.add?'checked':''}> ${esc(t('permAdd'))}</label>
      <label class="field" style="display:flex; align-items:center; gap:6px; flex-direction:row;"><input type="checkbox" id="u_perm_remove" ${v.perms.remove?'checked':''}> ${esc(t('permRemove'))}</label>
      <label class="field" style="display:flex; align-items:center; gap:6px; flex-direction:row;"><input type="checkbox" id="u_perm_evaluate" ${v.perms.evaluate?'checked':''}> ${esc(t('permEvaluate'))}</label>
      <label class="field" style="display:flex; align-items:center; gap:6px; flex-direction:row;"><input type="checkbox" id="u_perm_print" ${v.perms.print?'checked':''}> ${esc(t('permPrint'))}</label>
    </div>
    <div style="margin-top:14px; display:flex; gap:10px;">
      <button class="btn btn-primary" onclick="saveUserForm()">${esc(t('updateEmployee'))}</button>
      <button class="btn btn-ghost" onclick="cancelUserEdit()">${esc(t('clearForm'))}</button>
    </div>
  `;
}
/* Editing an existing user's role/department/grade/permissions is the one
   sensitive action this whole feature exists to lock down, so it goes
   through the admin_update_user RPC — enforced admin-only in the database
   itself (see the migration), not just hidden behind isAdmin() in the UI. */
async function saveUserForm(){
  const id = state.ui.editingUserId;
  if(!id) return;
  const rec = {
    role: document.getElementById('u_role').value,
    department: document.getElementById('u_dept').value,
    grade: document.getElementById('u_grade').value,
    perms: {
      add: document.getElementById('u_perm_add').checked,
      remove: document.getElementById('u_perm_remove').checked,
      evaluate: document.getElementById('u_perm_evaluate').checked,
      print: document.getElementById('u_perm_print').checked,
    }
  };
  const { error } = await sb.rpc('admin_update_user', { p_user_id:id, p_role:rec.role, p_department:rec.department, p_grade:rec.grade, p_perms:rec.perms });
  if(error){ showToast(error.message); return; }
  const idx = state.users.findIndex(u=>u.id===id);
  if(idx>-1) state.users[idx] = Object.assign({}, state.users[idx], rec);
  state.ui.editingUserId = null;
  render(); showToast('✓');
}
function editUser(id){ state.ui.editingUserId = id; render(); }
function cancelUserEdit(){ state.ui.editingUserId = null; render(); }
function deleteUser(id){
  state.users = state.users.filter(u=>u.id!==id);
  sb.rpc('admin_delete_user', { p_user_id:id }).then(({error})=>{ if(error) showToast(error.message); });
  render();
}

/* ============================== Init ============================== */
render(); // shows the loading screen immediately (state.session.authReady is false)
async function boot(){
  try{
    const { data: { session } } = await sb.auth.getSession();
    if(session){ await onSignedIn(session); }
  }catch(e){ /* fall through to the sign-in screen below */ }
  state.session.authReady = true;
  render();
  // Keep the app in sync with sign-in/out that happens in another tab, or
  // with a session Supabase refreshes/expires on its own.
  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_OUT'){ state.session.userId=null; state.users=[]; state.employees=[]; state.departments={}; state.evaluations={}; render(); }
  });
}
boot();

/* Register the service worker so the app can be installed (PWA) and
   reopened without a connection. Wrapped defensively: some hosting
   contexts (e.g. a sandboxed preview) don't allow service workers at all,
   and that must never break the app itself. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
