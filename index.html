<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeopleFlow | HR, Payroll & Performance Suite</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2761">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PeopleFlow">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='22' fill='%23C99A3B'/%3E%3Ctext x='50' y='68' font-family='Arial, sans-serif' font-weight='900' font-size='46' text-anchor='middle' fill='%2312173F'%3EPF%3C/text%3E%3C/svg%3E">
<link rel="icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    /* "official" color theme (default) — the brand's navy + gold identity */
    --navy:#1E2761; --navy-dark:#12173F; --navy-light:#2E3A8C;
    --gold:#C99A3B; --gold-light:#E8C878;
    --ice:#DDE3F9; --bg:#F4F6FB; --card:#FFFFFF; --border:#E2E6EF;
    --text:#1F2430; --gray:#6B7280;
    --heading:#1E2761; /* headings/badge text — separate from --navy so dark mode can lighten it without touching brand backgrounds */
    --accent-soft:rgba(201,154,59,0.16); --accent-soft2:rgba(30,39,97,0.14); --glow:rgba(201,154,59,0.55);
    --green:#2E7D5B; --green-bg:#E7F4EE;
    --orange:#C97A4A; --orange-bg:#FBEEE6;
    --red:#B33A3A; --red-bg:#FBEAEA;
    --amber:#C99A3B; --amber-bg:#FBF3E1;
    --radius:10px; --radius-sm:8px;
    --shadow:0 1px 3px rgba(30,39,97,0.08), 0 1px 2px rgba(30,39,97,0.06);
    --shadow-md:0 4px 14px rgba(18,23,63,0.10), 0 2px 6px rgba(18,23,63,0.06);
    --shadow-lg:0 12px 32px rgba(18,23,63,0.16), 0 4px 10px rgba(18,23,63,0.08);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  /* ---- Color themes: swap the two brand hues + accent glow, everything else (badges, buttons, topbar) follows automatically since they're all built from these variables ---- */
  :root[data-color-theme="vibrant"]{
    --navy:#3B1E6B; --navy-dark:#230F49; --navy-light:#5B2FA0;
    --gold:#E8408F; --gold-light:#F472B6;
    --ice:#EFE3FB; --accent-soft:rgba(232,64,143,0.18); --accent-soft2:rgba(59,30,107,0.16); --glow:rgba(232,64,143,0.6);
  }
  :root[data-color-theme="ocean"]{
    --navy:#0E4C63; --navy-dark:#0A3547; --navy-light:#136E8C;
    --gold:#2FBFA0; --gold-light:#5FE0C4;
    --ice:#DCF3F0; --accent-soft:rgba(47,191,160,0.18); --accent-soft2:rgba(14,76,99,0.16); --glow:rgba(47,191,160,0.6);
  }
  :root[data-color-theme="sunset"]{
    --navy:#3A2647; --navy-dark:#241730; --navy-light:#5A3D6B;
    --gold:#FF7A45; --gold-light:#FFB199;
    --ice:#FDE9E0; --accent-soft:rgba(255,122,69,0.2); --accent-soft2:rgba(58,38,71,0.16); --glow:rgba(255,122,69,0.6);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
      --heading:#C9D0FF;
      --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
      --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
      --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
    }
  }
  :root[data-theme="dark"] {
    --bg:#11142B; --card:#181C3A; --border:#2A2F55; --text:#EDEFFA; --gray:#9CA3C4; --ice:#232A5C;
    --heading:#C9D0FF;
    --green-bg:#12331F; --orange-bg:#3A2416; --red-bg:#3A1414; --amber-bg:#3A2E0E;
    --shadow:0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.24);
    --shadow-md:0 4px 14px rgba(0,0,0,0.34); --shadow-lg:0 12px 32px rgba(0,0,0,0.42);
  }
  :root[data-theme="dark"][data-color-theme="vibrant"], :root:not([data-theme="light"])[data-color-theme="vibrant"]{ --heading:#F4C9E8; }
  :root[data-theme="dark"][data-color-theme="ocean"], :root:not([data-theme="light"])[data-color-theme="ocean"]{ --heading:#B9F3E8; }
  :root[data-theme="dark"][data-color-theme="sunset"], :root:not([data-theme="light"])[data-color-theme="sunset"]{ --heading:#FFD9C2; }
  /* Decorative infographic-style background: soft color blobs + a faint dot grid.
     Colors derive from the active theme's accent so it changes with both the
     color theme and light/dark mode. Fixed + behind everything + non-interactive. */
  body::before{
    content:''; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(circle at 10% 10%, var(--accent-soft) 0%, transparent 42%),
      radial-gradient(circle at 90% 18%, var(--accent-soft2) 0%, transparent 40%),
      radial-gradient(circle at 25% 92%, var(--accent-soft) 0%, transparent 46%),
      radial-gradient(circle at 82% 88%, var(--accent-soft2) 0%, transparent 42%);
    transition:background .3s var(--ease);
  }
  body::after{
    content:''; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.55;
    background-image:radial-gradient(var(--border) 1px, transparent 1px);
    background-size:24px 24px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Cairo', Arial, Tahoma, sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);}
  [dir="ltr"] body{font-family:'Cairo', Arial, sans-serif;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:var(--gold-light); color:var(--navy-dark);}

  /* Accessible focus ring, everywhere, keyboard-only */
  *:focus-visible{outline:2.5px solid var(--gold); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; scroll-behavior:auto !important;}
  }

  .topbar{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color:#fff; padding:14px 20px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:50; box-shadow:var(--shadow-md);
    flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:linear-gradient(155deg, var(--gold-light), var(--gold));
    display:flex; align-items:center; justify-content:center; color:var(--navy-dark); font-weight:800; font-size:18px;
    flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.25);
  }
  .brand-text h1{font-size:15px; margin:0; font-weight:700; letter-spacing:.1px;}
  .brand-text p{font-size:11.5px; margin:0; opacity:0.75;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .pill-btn{
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); color:#fff;
    padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:600; display:flex; align-items:center; gap:6px;
    transition:background .18s var(--ease), transform .12s var(--ease);
  }
  .pill-btn:hover{background:rgba(255,255,255,0.22); transform:translateY(-1px);}
  .pill-btn:active{transform:translateY(0);}
  /* Icon-only topbar buttons (theme/lang toggles) — solid white squares, matching the Figma redesign's topbar */
  .icon-pill{
    background:#fff; border:none; color:var(--heading); padding:8px 12px; border-radius:8px;
    font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px; box-shadow:0 1px 2px rgba(0,0,0,0.06);
    transition:transform .12s var(--ease), box-shadow .16s var(--ease);
  }
  .icon-pill:hover{transform:translateY(-1px) scale(1.08); box-shadow:0 3px 8px rgba(0,0,0,0.14), 0 0 10px var(--glow);}
  .icon-pill:active{transform:translateY(0) scale(1);}

  /* Color-theme picker: small glowing swatch buttons in the topbar */
  .theme-picker{display:flex; align-items:center; gap:6px; padding:2px 4px;}
  .theme-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid rgba(255,255,255,0.55); cursor:pointer; padding:0;
    background:var(--dot-navy, #1E2761); box-shadow:0 0 0 rgba(0,0,0,0);
    transition:transform .16s var(--ease), box-shadow .2s var(--ease), border-color .16s var(--ease);
  }
  .theme-dot::after{ content:none; }
  .theme-dot[data-swatch="official"]{background:linear-gradient(135deg,#1E2761,#C99A3B);}
  .theme-dot[data-swatch="vibrant"]{background:linear-gradient(135deg,#3B1E6B,#E8408F);}
  .theme-dot[data-swatch="ocean"]{background:linear-gradient(135deg,#0E4C63,#2FBFA0);}
  .theme-dot[data-swatch="sunset"]{background:linear-gradient(135deg,#3A2647,#FF7A45);}
  .theme-dot:hover{transform:scale(1.22);}
  .theme-dot.active{border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25), 0 0 10px rgba(255,255,255,0.5);}

  .stepper{
    display:flex; gap:0; background:var(--card); border-bottom:1px solid var(--border);
    overflow-x:auto; position:sticky; top:66px; z-index:40; scrollbar-width:thin;
  }
  .step-item{
    flex:1; min-width:128px; padding:11px 12px; text-align:center; position:relative;
    font-size:12px; font-weight:700; color:var(--gray); display:flex; flex-direction:column; align-items:center; gap:4px;
    white-space:nowrap; transition:color .18s var(--ease), background .18s var(--ease);
  }
  .step-item::after{
    content:''; position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:0; height:3px;
    background:var(--gold); border-radius:3px 3px 0 0; transition:width .22s var(--ease);
  }
  .step-item .num{
    width:24px; height:24px; border-radius:50%; background:var(--border); color:var(--gray);
    display:flex; align-items:center; justify-content:center; font-size:13px; transition:background .18s var(--ease), color .18s var(--ease), transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .step-item .num svg{ width:14px; height:14px; display:block; transition:filter .18s var(--ease); }
  .step-item.active .num svg, .step-item.clickable:hover .num svg{ filter:drop-shadow(0 0 3px currentColor); }
  .step-item.active{color:var(--heading); background:linear-gradient(180deg, var(--accent-soft), transparent);}
  .step-item.active::after{width:56%; background:var(--gold);}
  .step-item.active .num{background:var(--navy); color:#fff; transform:scale(1.06); box-shadow:0 0 0 4px var(--accent-soft), 0 0 14px var(--glow);}
  .step-item.done .num{background:var(--green); color:#fff;}
  .step-item.clickable{cursor:pointer;}
  .step-item.clickable:hover{color:var(--heading); background:var(--accent-soft);}
  .step-item.clickable:hover .num{transform:scale(1.15); box-shadow:0 0 12px var(--glow);}

  main{max-width:1180px; margin:0 auto; padding:22px 18px 60px;}
  @keyframes stepFadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  main.step-anim{animation:stepFadeIn .3s var(--ease);}
  .section-head{margin-bottom:18px;}
  .section-head h2{font-size:21px; margin:0 0 4px; color:var(--heading); font-weight:800; letter-spacing:-.2px;}
  .section-head p{font-size:13px; color:var(--gray); margin:0;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; margin-bottom:16px; transition:box-shadow .2s var(--ease);}
  .card h3{margin:0 0 12px; font-size:15px; color:var(--heading); font-weight:800;}
  .card-flat{background:var(--ice); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px;}

  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{
    padding:9px 16px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:13px; font-weight:700; transition:background .16s var(--ease), color .16s var(--ease), border-color .16s var(--ease), transform .12s var(--ease);
  }
  .tab-btn:hover{border-color:var(--gold); transform:translateY(-1px);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--heading);}

  .form-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:760px){.form-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.form-grid{grid-template-columns:1fr;}}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--gray); margin-bottom:5px;}
  .field input, .field select{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13.5px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease); min-height:38px;
  }
  .field input:hover, .field select:hover{border-color:var(--gold-light);}
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);}

  .btn{
    padding:10px 18px; border-radius:10px; border:none; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px;
    transition:transform .12s var(--ease), box-shadow .18s var(--ease), background .16s var(--ease), opacity .16s var(--ease);
  }
  .btn:hover{transform:translateY(-1px);}
  .btn:active{transform:translateY(0);}
  .btn-primary{background:var(--navy); color:#fff; box-shadow:0 2px 8px rgba(30,39,97,0.25);}
  .btn-primary:hover{background:var(--navy-light); box-shadow:0 4px 14px rgba(30,39,97,0.32);}
  .btn-gold{background:linear-gradient(155deg, var(--gold-light), var(--gold)); color:var(--navy-dark); box-shadow:0 2px 8px rgba(201,154,59,0.3);}
  .btn-gold:hover{box-shadow:0 4px 14px rgba(201,154,59,0.4);}
  .btn-outline{background:transparent; border:1.5px solid var(--navy); color:var(--heading);}
  .btn-outline:hover{background:rgba(30,39,97,0.06);}
  .btn-ghost{background:var(--border); color:var(--text);}
  .btn-danger{background:var(--red-bg); color:var(--red); border:1px solid var(--red);}
  .btn-export-excel{background:transparent; border:1.5px solid var(--green); color:var(--green);}
  .btn-export-excel:hover{background:var(--green-bg);}
  .btn-export-pdf{background:transparent; border:1.5px solid var(--red); color:var(--red);}
  .btn-export-pdf:hover{background:var(--red-bg);}
  .btn-sm{padding:6px 11px; font-size:12px; border-radius:8px;}
  .btn:disabled{opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 10px; text-align:start; border-bottom:1px solid var(--border);}
  th{background:var(--ice); color:var(--heading); font-size:11px; font-weight:800; white-space:nowrap; letter-spacing:.1px; position:sticky; top:0;}
  tbody tr{transition:background .12s var(--ease);}
  tr:hover td{background:rgba(221,227,249,0.35);}
  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:10px; max-height:520px;}

  .badge{display:inline-block; padding:3px 10px; border-radius:999px; font-size:11px; font-weight:800;}
  .badge-green{background:var(--green-bg); color:var(--green);}
  .badge-amber{background:var(--amber-bg); color:var(--amber);}
  .badge-orange{background:var(--orange-bg); color:var(--orange);}
  .badge-red{background:var(--red-bg); color:var(--red);}
  .badge-navy{background:var(--ice); color:var(--heading);}

  .method-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
  @media (max-width:900px){.method-grid{grid-template-columns:repeat(3,1fr);}}
  @media (max-width:560px){.method-grid{grid-template-columns:repeat(2,1fr);}}
  .method-card{
    border:2px solid var(--border); border-radius:var(--radius); padding:14px 10px; text-align:center; background:var(--card);
    transition:border-color .18s var(--ease), transform .16s var(--ease), box-shadow .18s var(--ease), opacity .18s var(--ease);
  }
  .method-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-md), 0 0 16px var(--glow); border-color:var(--gold-light);}
  .method-card .mi{font-size:22px; margin-bottom:6px; transition:transform .18s var(--ease), filter .18s var(--ease);}
  .method-card:hover .mi{transform:scale(1.18); filter:drop-shadow(0 0 6px var(--glow));}
  .method-card .mt{font-weight:800; font-size:13px; color:var(--heading);}
  .method-card .md{font-size:10.5px; color:var(--gray); margin-top:3px;}
  .method-card.selected{border-color:var(--heading); background:var(--navy); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-md), 0 0 18px var(--glow); transform:translateY(-2px);}
  .method-card.selected .mt{color:#fff;}
  .method-card.selected .md{color:rgba(255,255,255,0.75);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--gray); border:1.5px dashed var(--border); border-radius:var(--radius); background:rgba(202,220,252,0.06);}
  .empty-state .ei{font-size:32px; margin-bottom:10px; opacity:.85;}

  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; justify-content:space-between;}
  .toolbar .left{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}

  .kv-row{display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13px;}
  .kv-row span:first-child{color:var(--gray);}
  .kv-row span:last-child{font-weight:700;}

  .score-hero{
    display:flex; align-items:center; gap:22px; background:linear-gradient(135deg,var(--navy),var(--navy-dark));
    color:#fff; border-radius:var(--radius); padding:24px; margin-bottom:16px; flex-wrap:wrap; box-shadow:var(--shadow-lg);
  }
  .score-circle{
    width:110px; height:110px; border-radius:50%; border:6px solid var(--gold); display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,0.05);
  }
  .score-circle b{font-size:26px;}
  .score-circle span{font-size:10.5px; opacity:0.8;}
  .score-info h3{margin:0 0 4px; font-size:17px;}
  .score-info p{margin:0; font-size:12.5px; opacity:0.85;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(6px); background:var(--navy); color:#fff;
    padding:11px 20px; border-radius:10px; font-size:13px; font-weight:700; z-index:200; box-shadow:var(--shadow-lg);
    opacity:0; pointer-events:none; transition:opacity .22s var(--ease), transform .22s var(--ease);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,18,45,0.55); z-index:150; display:flex; align-items:center; justify-content:center; padding:16px;
    animation:overlayIn .18s var(--ease);
  }
  @keyframes overlayIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes modalIn{ from{opacity:0; transform:scale(.96) translateY(6px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal{background:var(--card); border-radius:var(--radius); padding:20px; max-width:520px; width:100%; max-height:85vh; overflow:auto; box-shadow:var(--shadow-lg); animation:modalIn .2s var(--ease);}
  .modal h3{margin-top:0; color:var(--heading);}

  .card-warn{
    display:flex; align-items:center; gap:10px; background:var(--amber-bg); border:1px solid rgba(201,154,59,0.35);
    border-radius:var(--radius-sm); padding:12px 14px; margin-bottom:16px; color:#8a6a17; font-size:12.5px; font-weight:600; line-height:1.7;
  }
  :root[data-theme="dark"] .card-warn{ color:#E8C878; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .card-warn{ color:#E8C878; } }
  .hint{font-size:11.5px; color:var(--gray); margin-top:4px; line-height:1.6;}
  .divider{height:1px; background:var(--border); margin:16px 0;}
  .row-actions{display:flex; gap:6px;}
  .weight-warning{color:var(--red); font-size:12px; font-weight:700;}
  .explain-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media (max-width:600px){.explain-grid{grid-template-columns:1fr;}}

  .org-tree{overflow-x:auto;}
  .org-node{margin-bottom:4px;}
  .org-node-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:10px; cursor:pointer;
    transition:background .15s var(--ease); border:1px solid transparent;
  }
  .org-node-row:hover{background:var(--ice); border-color:var(--border);}
  .org-node-match{background:var(--amber-bg); border-color:var(--gold);}
  .org-node-root:not(.org-node-match){border-color:var(--gold-light);}
  .org-toggle{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--heading);
    font-size:11px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s var(--ease);
  }
  .org-toggle:hover{background:var(--ice);}
  .org-toggle-spacer{width:22px; flex-shrink:0;}
  .org-avatar{
    width:32px; height:32px; border-radius:50%; background:linear-gradient(155deg,var(--navy-light),var(--navy)); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; flex-shrink:0;
  }
  .org-node-info{min-width:0;}
  .org-node-name{font-weight:800; font-size:13.5px; color:var(--text); white-space:nowrap;}
  .org-node-meta{font-size:11px; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .org-children{border-inline-start:2px solid var(--border); padding-inline-start:6px; margin-inline-start:15px;}

  /* ============================== Post-login landing / department picker (hub) ============================== */
  .landing-wrap{max-width:1080px; margin:0 auto; padding:32px 20px 40px; text-align:center;}
  .landing-greeting{display:inline-block; font-size:12.5px; font-weight:700; color:var(--navy-dark); background:linear-gradient(155deg,var(--gold-light),var(--gold)); padding:6px 18px; border-radius:999px; margin-bottom:14px;}
  .landing-title{margin:0 0 8px; font-size:26px; font-weight:800; color:var(--heading);}
  .landing-sub{margin:0 auto 4px; font-size:13.5px; color:var(--gray); max-width:480px; line-height:1.7;}
  .landing-radial{position:relative; width:100%; max-width:640px; aspect-ratio:1/0.94; margin:34px auto 0; overflow:visible;}
  .pf-ln{position:absolute; left:50%; top:48%; height:2px; margin-top:-1px; border-radius:2px; transform-origin:0 50%;
    transform:rotate(var(--ang,0deg)) scaleX(0);
    background-image:repeating-linear-gradient(90deg, var(--border) 0 8px, transparent 8px 15px);
    transition:transform .45s cubic-bezier(.55,0,.8,.2) calc((3 - var(--i,0)) * 50ms);}
  .pf-hub.open .pf-ln{transform:rotate(var(--ang,0deg)) scaleX(1); transition:transform .8s cubic-bezier(.22,1,.36,1) calc(var(--i,0) * 140ms + 80ms);}
  .landing-hub{position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); width:27%; height:27%; border-radius:26%;
    background:linear-gradient(135deg,var(--gold-light),var(--gold)); box-shadow:var(--shadow-lg), 0 0 0 6px var(--card), 0 0 0 7px var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--navy-dark);
    border:0; cursor:pointer; font:inherit; padding:0; transition:transform .35s cubic-bezier(.22,1,.36,1);}
  .landing-hub:hover{transform:translate(-50%,-50%) scale(1.04);}
  .landing-hub:active{transform:translate(-50%,-50%) scale(.97);}
  .landing-hub-mark{font-family:inherit; font-weight:800; font-size:clamp(22px,6.5vw,40px); letter-spacing:.5px; color:var(--navy-dark);}
  .pf-pulse{position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); width:27%; height:27%; border-radius:26%;
    border:2px solid var(--gold); box-sizing:border-box; pointer-events:none; animation:pf-pulse 2.4s ease-out infinite;}
  .pf-hub.open .pf-pulse{animation:none; opacity:0;}
  @keyframes pf-pulse{0%{transform:translate(-50%,-50%) scale(1); opacity:.55;} 100%{transform:translate(-50%,-50%) scale(1.45); opacity:0;}}
  .landing-node{position:absolute; left:50%; top:48%; transform:translate(-50%,-50%) scale(.55); opacity:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; gap:8px; width:38%; text-decoration:none; color:inherit;
    cursor:pointer; background:none; border:none; padding:0; font:inherit;
    transition:left .5s cubic-bezier(.55,0,.8,.2) calc((3 - var(--i,0)) * 50ms), top .5s cubic-bezier(.55,0,.8,.2) calc((3 - var(--i,0)) * 50ms),
      transform .5s cubic-bezier(.55,0,.8,.2) calc((3 - var(--i,0)) * 50ms), opacity .35s ease;}
  .pf-hub.open .landing-node{left:var(--ox); top:var(--oy); transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto;
    transition:left .9s cubic-bezier(.22,1,.36,1) calc(var(--i,0) * 140ms), top .9s cubic-bezier(.22,1,.36,1) calc(var(--i,0) * 140ms),
      transform .9s cubic-bezier(.22,1,.36,1) calc(var(--i,0) * 140ms), opacity .5s ease calc(var(--i,0) * 140ms + 60ms);}
  .landing-node-circle{width:78px; height:78px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px rgba(30,39,97,0.3), 0 0 0 6px var(--bg); transition:transform .2s cubic-bezier(.2,.8,.2,1); flex-shrink:0;}
  .landing-node:hover .landing-node-circle{transform:scale(1.08);}
  .landing-node-circle svg{width:36px; height:36px;}
  .landing-node-label{font-size:13px; font-weight:800; color:var(--text); text-align:center; line-height:1.35; opacity:0; transition:opacity .2s ease;}
  .pf-hub.open .landing-node-label{opacity:1; transition:opacity .45s ease calc(var(--i,0) * 140ms + 480ms);}
  .landing-node:hover .landing-node-label{color:var(--heading);}
  .landing-node-sub{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3px 5px; font-size:10px; color:var(--gray); max-width:220px; opacity:0; transition:opacity .2s ease;}
  .pf-hub.open .landing-node-sub{opacity:1; transition:opacity .45s ease calc(var(--i,0) * 140ms + 480ms);}
  @media (prefers-reduced-motion:reduce){
    .landing-node, .landing-node-label, .landing-node-sub, .pf-ln, .landing-hub{transition-duration:1ms !important;}
    .pf-pulse{animation:none;}
  }
  .landing-list{display:none;}
  @media (max-width:700px){
    .landing-radial{display:none;}
    .landing-list{display:flex; flex-direction:column; gap:12px; max-width:420px; margin:24px auto 0;}
    .landing-list-item{display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:14px;
      padding:14px; text-decoration:none; color:inherit; cursor:pointer; text-align:start; width:100%;}
    .landing-list-icon{width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
    .landing-list-icon svg{width:26px; height:26px;}
    .landing-list-text{min-width:0;}
    .landing-list-title{font-size:14px; font-weight:800; color:var(--text);}
    .landing-list-sub{font-size:11.5px; color:var(--gray); margin-top:2px;}
  }

  @media (max-width:640px){
    main{padding:16px 12px 50px;}
    .card, .card-flat{padding:14px;}
    .btn{padding:9px 14px;}
  }

  @media print{
    .topbar, .stepper, .no-print{display:none !important;}
    body{background:#fff;}
    main{max-width:100%; padding:0;}
    .print-sheet{display:block !important;}
  }
  .print-sheet{display:none;}
</style>
